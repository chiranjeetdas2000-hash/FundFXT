<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>FundFXT | Login & Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ============ BASE & FONTS ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ffffff;
            padding: 20px; /* Added padding for mobile safety */
        }

        /* ============ GLOW WRAPPER & CONTAINER ============ */
        .border-glow-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px; /* Responsive Width */
            min-height: 500px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .border-glow-wrapper::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 80%, #00b56a 95%, #00b56a 100%);
            animation: rotateBorder 3s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            position: absolute;
            inset: 3px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            z-index: 1;
        }

        /* ============ HIDE FORMS (For Forgot Password) ============ */
        .container.hide-forms .form-box,
        .container.hide-forms .toggle-box {
            display: none;
        }

        /* ============ BACK BUTTON ============ */
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 999;
            background: transparent;
            border: none;
            color: #555;
            font-size: 16px; /* Optimized size */
            font-weight: 500;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 5px;
        }

        .container.hide-forms .back-btn {
            display: flex;
        }

        .back-btn:hover {
            color: #00b56a;
        }

        /* ============ FORGET PASSWORD MODAL ============ */
        .forget-password-overlay {
            position: fixed; /* Changed to fixed for better mobile scrolling */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            display: none;
            padding: 20px;
        }

        .forget-password-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .forget-password-box h3 {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #555;
        }

        .forget-step { display: block; }
        .forget-step .btn { margin-top: 10px; }

        /* ============ FORM STYLES ============ */
        .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center; /* Centered internally */
            text-align: center;
            padding: 30px 40px;
            z-index: 20;
            transition: all 0.6s ease-in-out;
        }

        .form-box form { width: 100%; max-width: 320px; } /* Prevent form from stretching */

        .form-box.login { right: 0; }
        .container.active .form-box.login { right: -50%; opacity: 0; visibility: hidden; }

        .form-box.register { left: -50%; opacity: 0; visibility: hidden; z-index: 25; }
        .container.active .form-box.register { left: 0; opacity: 1; visibility: visible; }

        /* ============ INPUTS & BUTTONS ============ */
        .input-box {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }

        .input-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: #f4f4f4;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 13.5px;
            color: #000000;
            font-weight: 500;
            transition: border 0.3s;
        }
        .input-box input:focus { border-color: #00b56a; }
        .input-box input::placeholder { color: #777; font-weight: 400; }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #555;
            cursor: pointer;
        }

        .forgot-link { margin: -3px 0 10px; text-align: right; }
        .forgot-link a { font-size: 12.5px; color: #555; text-decoration: none; font-weight: 500; }
        .forgot-link a:hover { color: #00b56a; text-decoration: underline; }

        .btn {
            width: 100%;
            height: 42px;
            background: #00b56a;
            border-radius: 8px;
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 14.5px;
            color: #fff;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,181,106,0.2);
        }
        .btn:hover { background: #009a5b; transform: translateY(-1px); }

        form p { margin: 15px 0 10px; font-size: 12.5px; color: #666; }

        /* ============ SOCIAL ICONS ============ */
        .social-icons { display: flex; justify-content: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 34px;
            height: 34px;
            background: transparent;
            border: 2px solid #ddd;
            border-radius: 50%;
            font-size: 14px;
            color: #333;
            text-decoration: none;
            transition: 0.3s;
        }
        .social-icons a:hover { border-color: transparent; color: #fff; transform: translateY(-2px); }
        .social-icons a.fa-google:hover { background: #DB4437; }
        .social-icons a.fa-facebook-f:hover { background: #1877F2; }
        .social-icons a.fa-github:hover { background: #333333; }
        .social-icons a.fa-linkedin-in:hover { background: #0077B5; }
        .social-icons a.fa-instagram:hover { background: #E4405F; }
        .social-icons a.fa-x-twitter:hover { background: #000000; }

        /* ============ TOGGLE BOX ANIMATION ============ */
        .toggle-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            overflow: hidden;
            pointer-events: none;
        }
        .container.active .toggle-box { pointer-events: auto; }

        .toggle-box::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: #00b56a;
            border-radius: 0 150px 150px 0;
            z-index: 2;
            transition: all 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: auto;
        }
        .container.active .toggle-box::before {
            left: 50%;
            border-radius: 150px 0 0 150px;
        }

        .toggle-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
            transition: all 0.6s ease-in-out;
            pointer-events: auto;
            text-align: center;
            padding: 0 30px;
        }
        .toggle-panel h1 { font-size: clamp(22px, 3vw, 28px); margin-bottom: 10px; color: #fff;}
        .toggle-panel p { color: #fff; font-size: 14px; margin-bottom: 15px; }

        .toggle-panel.toggle-left { left: 0; transition-delay: 0.4s; }
        .container.active .toggle-panel.toggle-left { left: -50%; transition-delay: 0.1s; }

        .toggle-panel.toggle-right { right: -50%; transition-delay: 0.1s; }
        .container.active .toggle-panel.toggle-right { right: 0; transition-delay: 0.4s; }

        .toggle-panel .btn {
            width: 140px;
            background: transparent;
            border: 2px solid #fff;
            margin-top: 10px;
            box-shadow: none;
        }
        .toggle-panel .btn:hover { background: #fff; color: #00b56a; }


        /* ==========================================================
           📱 RESPONSIVE MOBILE VIEW (VERTICAL SLIDE ANIMATION) 
           ========================================================== */
        @media (max-width: 768px) {
            .border-glow-wrapper { min-height: 650px; }
            
            /* Forms stack vertically */
            .form-box { width: 100%; height: 60%; padding: 25px 20px; }
            
            /* Login Form at Bottom */
            .form-box.login { top: 40%; right: auto; left: 0; }
            .container.active .form-box.login { top: 40%; right: auto; left: 0; opacity: 0; visibility: hidden; }

            /* Register Form at Top */
            .form-box.register { left: 0; top: 0; height: 65%; }
            .container.active .form-box.register { left: 0; top: 0; }

            /* Toggle Box slides Top to Bottom instead of Left to Right */
            .toggle-box::before {
                width: 100%; 
                height: 40%; 
                top: 0; 
                left: 0; 
                border-radius: 0 0 100px 100px;
            }
            .container.active .toggle-box::before {
                left: 0; 
                top: 60%; 
                border-radius: 100px 100px 0 0;
            }

            /* Adjust Toggle Panels */
            .toggle-panel { width: 100%; height: 40%; padding: 0 20px; }
            
            /* Toggle Left (Register Message) at Top */
            .toggle-panel.toggle-left { left: 0; top: 0; right: auto; }
            .container.active .toggle-panel.toggle-left { left: 0; top: -40%; } /* Slides Up */

            /* Toggle Right (Login Message) at Bottom */
            .toggle-panel.toggle-right { right: auto; left: 0; bottom: -40%; top: auto; }
            .container.active .toggle-panel.toggle-right { right: auto; left: 0; bottom: 0; top: auto; }
        }
    </style>
</head>
<body>
    <div class="border-glow-wrapper">
        <div class="container" id="container">
            
            <!-- BACK BUTTON -->
            <button class="back-btn" onclick="closeForgetPassword()"><i class="fa-solid fa-arrow-left"></i> Back</button>

            <!-- Login Form -->
            <div class="form-box login">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <h1>Login</h1>
                    <div class="input-box">
                        <input type="text" id="login_username" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="login_password" placeholder="Password" required>
                        <i class="fa-solid fa-lock" style="right: 40px;"></i>
                        <i class="fa-solid fa-eye" id="toggleLoginPassword" onclick="togglePassword('login_password', 'toggleLoginPassword')"></i>
                    </div>
                    <div class="forgot-link">
                        <a href="#" id="forgotLink">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p>or login with social platforms</p>
                    <div class="social-icons">
                        <a href="#" class="fa-brands fa-google"></a>
                        <a href="#" class="fa-brands fa-facebook-f"></a>
                        <a href="#" class="fa-brands fa-github"></a>
                        <a href="#" class="fa-brands fa-linkedin-in"></a>
                        <a href="#" class="fa-brands fa-instagram"></a>
                        <a href="#" class="fa-brands fa-x-twitter"></a>
                    </div>
                </form>
            </div>

            <!-- Register Form -->
            <div class="form-box register">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <h1>Registration</h1>
                    <div class="input-box">
                        <input type="text" id="reg_username" placeholder="Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="email" id="reg_email" placeholder="Email" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="reg_password" placeholder="Password" required>
                        <i class="fa-solid fa-lock" style="right: 40px;"></i>
                        <i class="fa-solid fa-eye" id="toggleRegPassword" onclick="togglePassword('reg_password', 'toggleRegPassword')"></i>
                    </div>
                    <button type="submit" class="btn">Register</button>
                    <p>or register with social platforms</p>
                    <div class="social-icons">
                        <a href="#" class="fa-brands fa-google"></a>
                        <a href="#" class="fa-brands fa-facebook-f"></a>
                        <a href="#" class="fa-brands fa-github"></a>
                        <a href="#" class="fa-brands fa-linkedin-in"></a>
                        <a href="#" class="fa-brands fa-instagram"></a>
                        <a href="#" class="fa-brands fa-x-twitter"></a>
                    </div>
                </form>
            </div>

            <!-- Toggle Box -->
            <div class="toggle-box">
                <div class="toggle-panel toggle-left">
                    <h1>Hello, Welcome!</h1>
                    <p>Don't have an account?</p>
                    <button class="btn register-btn" id="registerToggle">Register</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome Back!</h1>
                    <p>Already have an account?</p>
                    <button class="btn login-btn" id="loginToggle">Login</button>
                </div>
            </div>

            <!-- FORGET PASSWORD MODAL -->
            <div class="forget-password-overlay" id="forgetOverlay" style="display:none;">
                <div class="forget-password-box">
                    <h3>Reset Password</h3>
                    <!-- Step 1: Email -->
                    <div id="step1" class="forget-step">
                        <div class="input-box">
                            <input type="email" id="fp_email" placeholder="Enter Registered Email" required>
                        </div>
                        <button class="btn" onclick="sendOTP()">Send OTP</button>
                    </div>
                    <!-- Step 2: OTP -->
                    <div id="step2" class="forget-step" style="display:none;">
                        <div class="input-box">
                            <input type="text" id="fp_otp" placeholder="Enter 6-digit OTP" required>
                        </div>
                        <button class="btn" onclick="verifyOTP()">Verify OTP</button>
                    </div>
                    <!-- Step 3: New Password -->
                    <div id="step3" class="forget-step" style="display:none;">
                        <div class="input-box">
                            <input type="password" id="fp_new_password" placeholder="New Password" required>
                        </div>
                        <div class="input-box">
                            <input type="password" id="fp_confirm_password" placeholder="Confirm New Password" required>
                        </div>
                        <button class="btn" onclick="resetPassword()">Reset Password</button>
                    </div>
                    <button class="modal-close" onclick="closeForgetPassword()">✕</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ TOGGLE LOGIC ============
        const container = document.getElementById('container');
        const registerBtn = document.querySelector('.register-btn');
        const loginBtn = document.querySelector('.login-btn');

        registerBtn.addEventListener('click', () => {
            container.classList.add('active');
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove('active');
        });

        // ============ FORGET PASSWORD LOGIC ============
        const forgetOverlay = document.getElementById('forgetOverlay');
        const forgotLink = document.getElementById('forgotLink');

        // Open forget password (login/register forms hide honge)
        forgotLink.addEventListener('click', function(e) {
            e.preventDefault();
            container.classList.add('hide-forms');
            forgetOverlay.style.display = 'flex';
        });

        // Close forget password (wapas login/register par)
        function closeForgetPassword() {
            container.classList.remove('hide-forms');
            forgetOverlay.style.display = 'none';
        }

        // Step 1: Send OTP
        async function sendOTP() {
            try {
                const response = await fetch('https://fundfxt.onrender.com/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('fp_email').value })
                });
                const data = await response.json();
                if (data.success) {
                    console.log('OTP:', data.otp);
                    alert('OTP sent to your email! (Check console)');
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    alert(data.error || 'Email not found');
                }
            } catch (error) {
                alert('Server connection error!');
            }
        }

        // Step 2: Verify OTP
        async function verifyOTP() {
            try {
                const response = await fetch('http://localhost:3000/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('fp_email').value, otp: document.getElementById('fp_otp').value })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                } else {
                    alert(data.error || 'Invalid OTP');
                }
            } catch (error) {
                alert('Server connection error!');
            }
        }

        // Step 3: Reset Password
        async function resetPassword() {
            const newPass = document.getElementById('fp_new_password').value;
            const confirmPass = document.getElementById('fp_confirm_password').value;
            
            if (newPass !== confirmPass) {
                alert('Passwords do not match!');
                return;
            }
            
            try {
                const response = await fetch('https://fundfxt.onrender.com/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('fp_email').value, password: newPass })
                });
                const data = await response.json();
                if (data.success) {
                    alert('Password reset successfully!');
                    closeForgetPassword();
                } else {
                    alert(data.error || 'Password reset failed!');
                }
            } catch (error) {
                alert('Server connection error!');
            }
        }

        // ============ PASSWORD VIEW/HIDE ============
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ============ REGISTER BACKEND ============
        async function handleRegister(event) {
            event.preventDefault();
            const trader_id = document.getElementById('reg_username').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;

            try {
                const response = await fetch('https://fundfxt.onrender.com/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trader_id, email, phone: '', password })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('fundfxt_token', data.token);
                    alert('Registration Successful!');
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.error || 'Registration failed!');
                }
            } catch (error) {
                alert('Server connection error!');
            }
        }

        // ============ LOGIN BACKEND ============
        async function handleLogin(event) {
            event.preventDefault();
            const identifier = document.getElementById('login_username').value;
            const password = document.getElementById('login_password').value;
            const trimmedPassword = password.trim();

            try {
                const response = await fetch('https://fundfxt.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password: trimmedPassword })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('fundfxt_token', data.token);
                    alert('Login Successful!');
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.error || 'Login failed!');
                }
            } catch (error) {
                alert('Server connection error!');
            }
        }
    </script>
</body>
</html>
