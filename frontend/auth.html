<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FundFXT | Login & Registration</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}body{min-height:100vh;background:#fff;display:flex;align-items:center;justify-content:center;padding:18px;color:#333}.wrap{width:min(900px,100%);min-height:650px;border-radius:28px;position:relative;overflow:hidden;background:#fff;box-shadow:0 20px 60px #0001;border:1px solid #e8e8e8}.glow{position:absolute;inset:-60%;background:conic-gradient(transparent 0 80%,#00b56a 95%,#00b56a);animation:spin 3s linear infinite}.panel{position:absolute;inset:3px;background:#fff;border-radius:25px;z-index:1;overflow:hidden}.form{position:absolute;top:0;width:50%;height:100%;padding:45px;display:flex;align-items:center;justify-content:center;z-index:5;transition:.45s}.form form{width:100%;max-width:340px}.form h1{font-size:28px;margin-bottom:20px}.login{right:0}.register{left:-50%;opacity:0;visibility:hidden}.active .login{right:-50%;opacity:0;visibility:hidden}.active .register{left:0;opacity:1;visibility:visible}.input{position:relative;margin:0 0 13px}.input input,.input textarea{width:100%;padding:13px 40px 13px 14px;border:1px solid #d3d3d3;border-radius:10px;background:#f6f6f6;outline:none;color:#222}.input textarea{height:70px;resize:none}.input input:focus,.input textarea:focus{border-color:#00b56a;background:#fff;box-shadow:0 0 0 3px #00b56a18}.input i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#777;cursor:pointer}.hint{font-size:10px;color:#888;margin:-7px 0 10px 4px}.forgot{text-align:right;margin:-3px 0 12px}.forgot a{font-size:12px;color:#555}.btn{width:100%;height:45px;border:0;border-radius:10px;background:#00b56a;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.switch{margin-top:18px;text-align:center;font-size:12px;color:#666}.switch a{color:#00b56a;font-weight:700;text-decoration:none}.side{position:absolute;right:0;top:0;width:50%;height:100%;background:#00b56a;color:#fff;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px;border-radius:150px 0 0 150px;transition:.5s}.active .side{right:50%;border-radius:0 150px 150px 0}.side h2{font-size:30px;margin-bottom:10px}.side p{font-size:14px;max-width:300px;margin-bottom:22px}.outline{width:150px;background:transparent;border:2px solid #fff}.msg{min-height:20px;margin:10px 0;text-align:center;font-size:12px;color:#d33}.loader{position:fixed;inset:0;background:#0008;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;color:#fff}.loader.on{display:flex}.spinner{width:44px;height:44px;border:4px solid #ffffff44;border-top-color:#00d084;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.on{display:flex}.box{width:min(400px,100%);background:#fff;border-radius:16px;padding:24px;position:relative}.box h2{margin-bottom:15px}.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){body{padding:0;align-items:stretch}.wrap{min-height:100vh;border:0;border-radius:0}.panel{inset:0;border-radius:0}.form{width:100%;padding:30px 24px}.login{right:0}.register{left:0;transform:translateX(-100%);opacity:0}.active .login{right:0;transform:translateX(100%);opacity:0}.active .register{left:0;transform:translateX(0);opacity:1}.side{display:none}}</style></head><body><div class="wrap"><div class="glow"></div><div class="panel" id="authPanel"><section class="form login"><form onsubmit="handleLogin(event)"><h1>Welcome Back</h1><div class="input"><input id="login_username" placeholder="Trader ID or Email" required><i class="fa-solid fa-user"></i></div><div class="input"><input id="login_password" type="password" placeholder="Password" required><i class="fa-solid fa-eye" onclick="togglePass('login_password',this)"></i></div><div class="forgot"><a href="#" onclick="openReset(event)">Forgot Password?</a></div><div id="loginMsg" class="msg"></div><button id="loginBtn" class="btn" type="submit">Login</button><div class="switch">Don't have an account? <a href="#" onclick="switchAuth(event,'register')">Register here</a></div></form></section><section class="form register"><form onsubmit="handleRegister(event)"><h1>Create Account</h1><div class="input"><input id="reg_legal_name" placeholder="Legal Name" required><i class="fa-solid fa-id-card"></i></div><div class="input"><input id="reg_username" placeholder="Trader ID" required><i class="fa-solid fa-user"></i></div><div class="input"><input id="reg_email" type="email" placeholder="Email" required><i class="fa-solid fa-envelope"></i></div><div class="input"><input id="reg_phone" placeholder="Phone Number" required><i class="fa-solid fa-phone"></i></div><div class="input"><textarea id="reg_address" placeholder="Legal Address" required></textarea></div><div class="input"><input id="reg_affiliate_code" placeholder="Affiliate Code (optional)"><i class="fa-solid fa-share-nodes"></i></div><div class="input"><input id="reg_password" type="password" placeholder="Password" required><i class="fa-solid fa-eye" onclick="togglePass('reg_password',this)"></i></div><div class="input"><input id="reg_confirm_password" type="password" placeholder="Confirm Password" required><i class="fa-solid fa-eye" onclick="togglePass('reg_confirm_password',this)"></i></div><div id="registerMsg" class="msg"></div><button id="registerBtn" class="btn" type="submit">Register</button><div class="switch">Already have an account? <a href="#" onclick="switchAuth(event,'login')">Login here</a></div></form></section><aside class="side"><h2 id="sideTitle">Hello, Welcome!</h2><p id="sideText">Join FundFXT and manage your trading journey from one secure dashboard.</p><button class="btn outline" onclick="switchAuth(event,'register')">Register</button></aside></div></div><div id="loader" class="loader"><div class="spinner"></div><b id="loaderText">Processing, please wait…</b></div><div id="resetModal" class="modal"><div class="box"><button class="close" onclick="closeReset()">×</button><h2>Reset Password</h2><div id="resetStep1"><div class="input"><input id="fp_email" type="email" placeholder="Registered email"></div><button class="btn" onclick="sendOTP()">Send OTP</button></div><div id="resetStep2" style="display:none"><div class="input"><input id="fp_otp" placeholder="6-digit OTP"></div><button class="btn" onclick="verifyOTP()">Verify OTP</button></div><div id="resetStep3" style="display:none"><div class="input"><input id="fp_new_password" type="password" placeholder="New password"></div><div class="input"><input id="fp_confirm_password" type="password" placeholder="Confirm password"></div><button class="btn" onclick="resetPassword()">Reset Password</button></div><div id="resetMsg" class="msg"></div></div></div><script>const API='https://fundfxt.onrender.com';function switchAuth(e,mode){e.preventDefault();const p=document.getElementById('authPanel');p.classList.toggle('active',mode==='register');document.getElementById('sideTitle').textContent=mode==='register'?'Welcome Back!':'Hello, Welcome!';document.getElementById('sideText').textContent=mode==='register'?'Already have an account? Login to continue.':'Join FundFXT and manage your trading journey from one secure dashboard.'}function togglePass(id,i){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';i.classList.toggle('fa-eye-slash');i.classList.toggle('fa-eye')}function loading(on,text='Processing, please wait…'){document.getElementById('loaderText').textContent=text;document.getElementById('loader').classList.toggle('on',on)}function message(id,text,bad=true){const m=document.getElementById(id);m.textContent=text;m.style.color=bad?'#d33':'#00a85f'}async function handleLogin(e){e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;message('loginMsg','');loading(true,'Signing you in…');try{const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('login_username').value.trim(),password:document.getElementById('login_password').value.trim()})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Login failed');localStorage.setItem('fundfxt_token',d.token);location.replace('/dashboard.html')}catch(err){loading(false);btn.disabled=false;message('loginMsg',err.message,true)}}async function handleRegister(e){e.preventDefault();const p=document.getElementById('reg_password').value,c=document.getElementById('reg_confirm_password').value;if(p!==c){message('registerMsg','Passwords do not match');return}const btn=document.getElementById('registerBtn');btn.disabled=true;loading(true,'Creating your account…');try{const body={trader_id:document.getElementById('reg_username').value.trim(),email:document.getElementById('reg_email').value.trim(),phone:document.getElementById('reg_phone').value.trim(),password:p,legal_name:document.getElementById('reg_legal_name').value.trim(),address:document.getElementById('reg_address').value.trim(),referred_by_code:document.getElementById('reg_affiliate_code').value.trim()};const r=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Registration failed');localStorage.setItem('fundfxt_token',d.token);location.replace('/dashboard.html')}catch(err){loading(false);btn.disabled=false;message('registerMsg',err.message,true)}}function openReset(e){e.preventDefault();document.getElementById('resetModal').classList.add('on')}function closeReset(){document.getElementById('resetModal').classList.remove('on')}async function sendOTP(){const email=document.getElementById('fp_email').value.trim();message('resetMsg','Sending OTP…',false);try{const r=await fetch(API+'/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Unable to send OTP');document.getElementById('resetStep1').style.display='none';document.getElementById('resetStep2').style.display='block';message('resetMsg','OTP sent.',false)}catch(err){message('resetMsg',err.message,true)}}async function verifyOTP(){const email=document.getElementById('fp_email').value.trim(),otp=document.getElementById('fp_otp').value.trim();try{const r=await fetch(API+'/api/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,otp})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Invalid OTP');document.getElementById('resetStep2').style.display='none';document.getElementById('resetStep3').style.display='block';message('resetMsg','OTP verified.',false)}catch(err){message('resetMsg',err.message,true)}}async function resetPassword(){const email=document.getElementById('fp_email').value.trim(),otp=document.getElementById('fp_otp').value.trim(),p=document.getElementById('fp_new_password').value,c=document.getElementById('fp_confirm_password').value;if(p!==c){message('resetMsg','Passwords do not match');return}try{const r=await fetch(API+'/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,otp,password:p,reset_token:''})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Password reset failed');message('resetMsg','Password reset successfully.',false);setTimeout(closeReset,700)}catch(err){message('resetMsg',err.message,true)}}</script></body></html>
