<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FundFXT | Trading Terminal</title>
  <link rel="stylesheet" href="/fundfxt-design-system.css?v=20260909">
  <link rel="stylesheet" href="/css/trading-terminal.css?v=20260910">
  <link rel="stylesheet" href="/css/trading-terminal-market.css">
  <link rel="stylesheet" href="/css/trading-terminal-pairs.css">
  <link rel="stylesheet" href="/css/trading-terminal-mobile.css">
  <link rel="stylesheet" href="/css/trading-terminal-workspace.css?v=20260910">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="tradeFeedback" class="trade-feedback" role="status" aria-live="polite"></div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="/dashboard.html">Fund<i>FXT</i></a>
      <div class="top-center"><span id="market">● OFFLINE</span></div>
      <div class="top-right">
        <button id="terminalLogoutBtn" class="icon-btn logout-icon" type="button" aria-label="Logout" title="Logout"><i data-lucide="power"></i></button>
        <button id="accountMenuBtn" class="icon-btn" type="button" aria-label="Account rules and progress" title="Account rules & progress"><i data-lucide="user-round"></i></button>
      </div>
    </header>

    <main class="workspace">
      <section id="center" class="panel center mobile-active">
        <div class="chart-head">
          <button id="chartBack" class="mobile-only icon-btn" type="button">←</button>
          <div class="chart-symbol-wrap">
            <div id="selectedSymbol" class="selected-symbol">EURUSD</div>
            <span class="chart-live-label"><i></i> LIVE MARKET</span>
          </div>
          <div class="chart-account-strip">
            <span id="chartBalance">Balance —</span>
            <span id="chartEquity">Equity —</span>
          </div>
          <button id="chartFocusBtn" class="chart-focus-btn" type="button" title="Focus chart"><span>Focus</span><b>⛶</b></button>
          <button id="chartMaxBtn" class="chart-max-btn" type="button" title="Maximize chart">⛶</button>
        </div>
        <div id="chartWrap" class="chart-wrap"><div id="tv" class="tv-wrap"></div><div id="chartResize" class="chart-resize"><span></span></div></div>
      </section>

      <aside id="right" class="panel right">
        <div class="terminal-rail-head">
          <div><span class="eyebrow">FUNDFXT TERMINAL</span><strong id="rightAccount">—</strong></div>
          <button id="rightCollapseBtn" class="panel-slider-btn" type="button" aria-label="Collapse control panel">›</button>
        </div>
        <div class="right-section-tabs" role="tablist" aria-label="Terminal controls">
          <button class="right-section-tab active" data-section="pairs" type="button"><i data-lucide="star"></i><span>Pairs</span></button>
          <button class="right-section-tab" data-section="orders" type="button"><i data-lucide="arrow-left-right"></i><span>Orders</span></button>
          <button class="right-section-tab" data-section="trades" type="button"><i data-lucide="briefcase-business"></i><span>Trades</span></button>
        </div>

        <section id="terminalPairs" class="terminal-section active">
          <div class="section-heading"><div><h2>Favorite Pairs</h2><span>Live quotes &amp; quick access</span></div><button id="addPairBtn" class="small-btn" type="button">+ Add</button></div>
          <input id="search" class="search" placeholder="Search pairs…" autocomplete="off">
          <div id="watchlist" class="watchlist"></div>
        </section>

        <section id="terminalOrders" class="terminal-section">
          <div class="section-heading"><div><h2>Order Execution</h2><span>Market, Limit &amp; Stop orders</span></div><span class="execution-symbol-badge" id="executionSymbol">EURUSD</span></div>
          <div class="ticket terminal-ticket">
            <div class="ticket-row">
              <div class="field"><label>ORDER</label><select id="orderType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option><option value="STOP">Stop</option></select></div>
              <div class="field"><label>LOT</label><input id="volume" type="number" min="0.01" max="2" step="0.01" value="0.01"></div>
              <div id="pendingFields" class="field hidden"><label>ENTRY</label><input id="entry" type="number" step="any"></div>
              <div class="field"><label>SL</label><input id="sl" type="number" step="any" placeholder="Optional"></div>
              <div class="field"><label>TP</label><input id="tp" type="number" step="any" placeholder="Optional"></div>
            </div>
            <div class="ticket-actions"><button id="sell" class="trade-btn sell" type="button"><span>SELL</span><small>Execute</small></button><button id="buy" class="trade-btn buy" type="button"><span>BUY</span><small>Execute</small></button></div>
          </div>
          <div class="order-subsection"><div class="subsection-title"><span>OPEN ORDERS</span><button id="ordersRefresh" type="button">Refresh</button></div><div id="pendingOrderScroll" class="pending-order-scroll"></div></div>
        </section>

        <section id="terminalTrades" class="terminal-section">
          <div class="section-heading"><div><h2>Trades</h2><span>Open positions &amp; history</span></div></div>
          <div class="right-tabs"><button class="right-tab active" data-tab="OPEN" type="button">Open</button><button class="right-tab" data-tab="PENDING" type="button">Pending</button><button class="right-tab" data-tab="HISTORY" type="button">History</button></div>
          <div id="tradeScroll" class="trade-scroll"></div>
        </section>
      </aside>

      <button class="workspace-rail right-rail" data-workspace-rail="right" type="button" aria-label="Open terminal controls"><span>◈</span><b>CONTROLS</b></button>
    </main>

    <nav class="mobile-nav"><button data-view="pairs" type="button"><i data-lucide="star"></i><span>Pairs</span></button><button class="active" data-view="center" type="button"><i data-lucide="candlestick-chart"></i><span>Chart</span></button><button data-view="trades" type="button"><i data-lucide="briefcase-business"></i><span>Trades</span></button></nav>
  </div>

  <script src="/js/trading-terminal.js?v=20260910" defer></script>
  <script src="/js/trading-terminal-modify.js?v=20260910" defer></script>
  <script src="/js/trading-terminal-fixes.js?v=20260910" defer></script>
  <script src="/js/trading-terminal-pairs.js?v=20260910" defer></script>
  <script src="/js/trading-terminal-pending.js?v=20260910" defer></script>
  <script src="/js/trading-terminal-workspace.js?v=20260910" defer></script>
</body>
</html>
