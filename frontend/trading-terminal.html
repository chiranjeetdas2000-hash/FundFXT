<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FundFXT | Trading Terminal</title><link rel="stylesheet" href="/css/trading-terminal.css"><link rel="stylesheet" href="/css/trading-terminal-market.css"><link rel="stylesheet" href="/css/trading-terminal-mobile.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script></head><body><div id="tradeFeedback" class="trade-feedback" role="status" aria-live="polite"></div><div class="app"><header class="topbar"><a class="brand" href="/dashboard.html">Fund<i>FXT</i></a><div class="top-center"><span>Balance <b id="balance">—</b></span><span>Equity <b id="equity">—</b></span><span id="market">● OFFLINE</span></div><div class="top-right"><button id="refresh" class="icon-btn" type="button" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button><button id="accountMenuBtn" class="icon-btn" type="button" aria-label="Account"><i data-lucide="user-round"></i></button></div></header><main class="workspace"><section id="watch" class="panel watch mobile-active"><div class="panel-title"><div><h2>Favorite Pairs</h2><span class="muted">Quick access</span></div><button id="addPairBtn" class="small-btn" type="button">+ Add</button></div><input id="search" class="search" placeholder="Search pairs…"><div id="watchlist" class="watchlist"></div></section><section id="center" class="panel center"><div class="chart-head"><button id="chartBack" class="mobile-only icon-btn" type="button">←</button><div id="selectedSymbol" class="selected-symbol">EURUSD</div><button id="chartMaxBtn" class="chart-max-btn" type="button">⛶</button></div><div id="chartWrap" class="chart-wrap"><div id="tv" class="tv-wrap"></div><div id="chartResize" class="chart-resize"><span></span></div></div><div class="ticket"><div class="ticket-row"><div class="field"><label>ORDER</label><select id="orderType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option><option value="STOP">Stop</option></select></div><div class="field"><label>LOT</label><input id="volume" type="number" min="0.01" max="2" step="0.01" value="0.01"></div><div id="pendingFields" class="field hidden"><label>ENTRY</label><input id="entry" type="number"></div><div class="field"><label>SL</label><input id="sl" type="number" placeholder="Optional"></div><div class="field"><label>TP</label><input id="tp" type="number" placeholder="Optional"></div></div><div class="ticket-actions"><button id="sell" class="trade-btn sell" type="button">SELL</button><button id="buy" class="trade-btn buy" type="button">BUY</button></div></div></section><aside id="right" class="panel right"><div class="panel-title"><div><h2>Trades</h2><span id="rightAccount" class="muted">—</span></div><button id="tradesBack" class="small-btn mobile-only" type="button">Back</button></div><div class="right-tabs"><button class="right-tab active" data-tab="OPEN" type="button">Open</button><button class="right-tab" data-tab="PENDING" type="button">Pending</button><button class="right-tab" data-tab="HISTORY" type="button">History</button></div><div id="tradeScroll" class="trade-scroll"></div></aside></main><nav class="mobile-nav"><button class="active" data-view="watch" type="button"><i data-lucide="star"></i><span>Pairs</span></button><button data-view="center" type="button"><i data-lucide="candlestick-chart"></i><span>Chart</span></button><button data-view="right" type="button"><i data-lucide="briefcase-business"></i><span>Trades</span></button></nav></div><script src="/js/trading-terminal.js" defer></script><script src="/js/trading-terminal-modify.js" defer></script><script src="/js/trading-terminal-fixes.js" defer></script><script src="/js/trading-terminal-account-profile.js" defer></script><script src="/js/trading-terminal-market-fix.js" defer></script></body></html>
