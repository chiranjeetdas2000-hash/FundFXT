<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FundFXT | Settings</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#070a0f;--card:#11161d;--line:#27303b;--green:#00b56a;--muted:#94a3b8;--red:#ff4d5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Poppins,sans-serif}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#070a0fee;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:800}.logo span{color:var(--green)}.nav a{color:#b9c4d1;text-decoration:none;font-size:13px;margin-left:20px}.wrap{width:min(1000px,92%);margin:45px auto 80px}.title{margin-bottom:28px}.title h1{font-size:36px;margin:0 0 8px}.title p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}.card h2{font-size:18px;margin:0 0 18px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #ffffff0b;font-size:13px}.row:last-child{border-bottom:0}.label{color:var(--muted)}.value{font-weight:600;text-align:right;word-break:break-word}.status{color:var(--green)}label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}input,select{width:100%;padding:12px;background:#090d12;border:1px solid var(--line);border-radius:8px;color:#fff;outline:0}input:focus,select:focus{border-color:var(--green)}.btn{border:0;background:var(--green);color:#fff;padding:12px 18px;border-radius:8px;font:700 13px Poppins;cursor:pointer;margin-top:18px}.danger{background:#ff4d5a}.wide{grid-column:1/-1}.msg{font-size:12px;color:var(--green);margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.title h1{font-size:29px}.navlinks{display:none}}</style></head><body><header class="nav"><div class="logo">Fund<span>FXT</span></div><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="trading-terminal.html">Terminal</a><a href="affiliate.html">Affiliate</a></div></header><main class="wrap"><div class="title"><h1>Account Settings</h1><p>Manage your trader profile and security preferences.</p></div><div class="grid"><section class="card"><h2>Profile</h2><div class="row"><span class="label">Legal name</span><span class="value" id="name">Loading…</span></div><div class="row"><span class="label">Trader ID</span><span class="value" id="trader">Loading…</span></div><div class="row"><span class="label">Email</span><span class="value" id="email">Loading…</span></div><div class="row"><span class="label">Phone</span><span class="value" id="phone">Loading…</span></div><div class="row"><span class="label">KYC status</span><span class="value status" id="kyc">Loading…</span></div></section><section class="card"><h2>Security</h2><label>Current password</label><input type="password" id="oldPass"><label>New password</label><input type="password" id="newPass"><label>Confirm new password</label><input type="password" id="confirmPass"><button class="btn" onclick="changePassword()">Update Password</button><div id="msg" class="msg"></div></section><section class="card wide"><h2>Quick Actions</h2><div class="actions"><a class="btn" href="dashboard.html">Back to Dashboard</a><a class="btn" href="trading-terminal.html">Open Trading Terminal</a><button class="btn danger" onclick="logout()">Logout</button></div></section></div></main><script>const API='https://fundfxt.onrender.com';const token=()=>localStorage.getItem('fundfxt_token')||'';async function load(){try{const r=await fetch(API+'/api/user/profile',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('Unable to load profile');const d=await r.json();name.textContent=d.legal_name||'—';email.textContent=d.email||'—';phone.textContent=d.phone||'—';kyc.textContent=d.kyc_status||'—';try{const a=await fetch(API+'/api/accounts',{headers:{Authorization:'Bearer '+token()}});const x=await a.json();trader.textContent=(x.accounts?.[0]?.trader_id)||'—'}catch{trader.textContent='—'}}catch(e){location.href='Auth.html'}}async function changePassword(){msg.textContent='Password change requires the secure reset flow available through support.'}function logout(){localStorage.removeItem('fundfxt_token');localStorage.removeItem('fundfxt_selected_account');location.href='Auth.html'}load();</script></body></html>
