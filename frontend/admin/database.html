<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FundFXT Admin · Database Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
<style>
.db-page{padding:28px}.db-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.db-top h1{margin:4px 0}.db-top p{margin:0;color:var(--muted)}.db-actions,.db-toolbar{display:flex;gap:8px;flex-wrap:wrap}.db-grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.db-card{background:var(--card,#fff);border:1px solid var(--border,#ddd);border-radius:14px;padding:16px}.db-input{padding:9px 11px;border:1px solid var(--border,#ddd);border-radius:8px;background:transparent;color:inherit;font:inherit}.db-search{width:100%;margin-top:10px}.db-list{margin-top:10px;max-height:65vh;overflow:auto}.db-table-btn{display:block;width:100%;padding:10px;text-align:left;background:transparent;color:inherit;border:0;border-bottom:1px solid var(--border,#ddd);cursor:pointer}.db-table-btn:hover,.db-table-btn.active{background:rgba(0,181,106,.08);box-shadow:inset 3px 0 var(--green,#00b56a)}.db-table-btn small{color:var(--muted)}.db-scroll{overflow:auto;max-height:58vh;margin-top:12px}.db-table{width:100%;border-collapse:collapse;font-size:11px}.db-table th,.db-table td{padding:8px;border-bottom:1px solid var(--border,#ddd);text-align:left;vertical-align:top;white-space:nowrap}.db-table th{position:sticky;top:0;background:var(--card,#fff);z-index:1}.db-cell{white-space:pre-wrap!important;word-break:break-word;max-width:280px}.db-empty{padding:28px;text-align:center;color:var(--muted)}.db-danger{color:#c62828}.db-schema{margin-top:16px}.db-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:99}.db-modal.open{display:flex}.db-modal-box{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--card,#fff);border-radius:14px;padding:18px}.db-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.db-field label{display:block;font-size:10px;margin-bottom:4px}.db-field input{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--border,#ddd);border-radius:7px;background:transparent;color:inherit}@media(max-width:850px){.db-page{padding:16px}.db-top{flex-direction:column}.db-grid{grid-template-columns:1fr}.db-list{max-height:250px}.db-fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="db-page">
  <div class="db-top"><div><div class="eyebrow">Platform Data</div><h1>Database Control</h1><p>Live FundFXT MySQL administration. Access is restricted to authenticated administrators.</p></div><div class="db-actions"><button class="btn secondary" onclick="location.href='index.html'">← Admin Console</button><button class="btn" onclick="loadTables()">↻ Refresh</button></div></div>
  <div id="message"></div>
  <div class="db-grid">
    <section class="db-card"><b>Database Tables</b><input id="tableSearch" class="db-input db-search" placeholder="Search tables…" oninput="renderTables()"><div id="tables" class="db-list"><div class="db-empty">Loading…</div></div></section>
    <section class="db-card"><div id="tableHeader"><b>Select a table</b><p style="font-size:11px;color:var(--muted)">Choose a table to inspect live records.</p></div><div id="recordArea"></div></section>
  </div>
</div>
<div id="schemaModal" class="db-modal"><div class="db-modal-box"><div class="db-top"><div><h2 id="schemaTitle">Schema</h2><p>Live column and index metadata.</p></div><button class="icon-btn" onclick="closeModal('schemaModal')">×</button></div><div class="db-scroll"><table class="db-table"><thead><tr><th>Column</th><th>Type</th><th>Nullable</th><th>Key</th><th>Default</th><th>Extra</th></tr></thead><tbody id="schemaBody"></tbody></table></div></div></div>
<script>
const API='https://fundfxt.onrender.com';const token=localStorage.getItem('fundfxt_admin_token');if(!token)location.href='login.html';let tables=[],selected='',columns=[],rows=[],page=1,totalPages=1;
const $=id=>document.getElementById(id);const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers,...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.message||`Request failed (${r.status})`);return d}
function showError(e){$('message').innerHTML='<div class="error-box">'+esc(e.message||e)+'</div>'}function clearMessage(){$('message').innerHTML=''}
async function loadTables(){clearMessage();try{const d=await api('/api/admin/database/tables');tables=d.tables||[];renderTables()}catch(e){showError(e)}}
function renderTables(){const q=($('tableSearch').value||'').toLowerCase();const list=tables.filter(t=>String(t.name).toLowerCase().includes(q));$('tables').innerHTML=list.length?list.map(t=>`<button class="db-table-btn ${selected===t.name?'active':''}" onclick='selectTable(${JSON.stringify(t.name)})'><b>${esc(t.name)}</b><br><small>${Number(t.estimated_rows||0).toLocaleString()} estimated rows · ${esc(t.column_count||0)} columns</small></button>`).join(''):'<div class="db-empty">No tables found.</div>'}
async function selectTable(name){selected=name;page=1;renderTables();await Promise.all([loadRows(),loadSchemaInline()])}
async function loadRows(){if(!selected)return;try{const q=encodeURIComponent($('recordSearch')?.value||'');const d=await api(`/api/admin/database/tables/${encodeURIComponent(selected)}/rows?page=${page}&pageSize=50&search=${q}`);columns=d.columns||[];rows=d.rows||[];totalPages=d.totalPages||1;$('tableHeader').innerHTML=`<b>${esc(selected)}</b><p style="font-size:11px;color:var(--muted)">${Number(d.total||0).toLocaleString()} matching records · page ${d.page} of ${d.totalPages}</p>`;renderRecords(d)}catch(e){showError(e)}}
function renderRecords(d){const head=columns.map(c=>`<th>${esc(c.COLUMN_NAME)}</th>`).join('');const body=rows.map((r,i)=>'<tr>'+columns.map(c=>`<td class="db-cell">${esc(typeof r[c.COLUMN_NAME]==='object'?JSON.stringify(r[c.COLUMN_NAME]):r[c.COLUMN_NAME])}</td>`).join('')+'<td><button class="btn red" onclick="deleteRow('+i+')">Delete</button></td></tr>').join('');$('recordArea').innerHTML=`<div class="db-toolbar"><input id="recordSearch" class="db-input" style="flex:1;min-width:200px" placeholder="Search records…" value="${esc($('recordSearch')?.value||'')}" onkeydown="if(event.key==='Enter'){page=1;loadRows()}"><button class="btn secondary" onclick="loadSchemaModal()">Schema</button><button class="btn" onclick="addRow()">+ Add Record</button></div><div class="db-scroll"><table class="db-table"><thead><tr>${head}<th>Actions</th></tr></thead><tbody>${body||'<tr><td colspan="99" class="db-empty">No records found.</td></tr>'}</tbody></table></div><div class="db-actions" style="justify-content:space-between;margin-top:12px"><button class="btn secondary" onclick="if(page>1){page--;loadRows()}">← Previous</button><span style="font-size:11px;color:var(--muted);padding:9px">Page ${d.page} / ${d.totalPages}</span><button class="btn secondary" onclick="if(page<totalPages){page++;loadRows()}">Next →</button></div>`}
async function loadSchemaInline(){try{const d=await api(`/api/admin/database/tables/${encodeURIComponent(selected)}/schema`);columns=d.columns||columns}catch(e){showError(e)}}
async function loadSchemaModal(){try{const d=await api(`/api/admin/database/tables/${encodeURIComponent(selected)}/schema`);$('schemaTitle').textContent='Schema · '+selected;$('schemaBody').innerHTML=(d.columns||[]).map(c=>`<tr><td>${esc(c.COLUMN_NAME)}</td><td>${esc(c.COLUMN_TYPE)}</td><td>${esc(c.IS_NULLABLE)}</td><td>${esc(c.COLUMN_KEY||'')}</td><td>${esc(c.COLUMN_DEFAULT)}</td><td>${esc(c.EXTRA||'')}</td></tr>`).join('');$('schemaModal').classList.add('open')}catch(e){showError(e)}}
function closeModal(id){$(id).classList.remove('open')}
function addRow(){if(!selected)return;const raw=prompt('Enter the new record as JSON, for example {"name":"Test"}:');if(raw===null)return;let data;try{data=JSON.parse(raw)}catch{return showError(new Error('Invalid JSON'))}api(`/api/admin/database/tables/${encodeURIComponent(selected)}/rows`,{method:'POST',body:JSON.stringify({data})}).then(()=>{clearMessage();loadTables();loadRows()}).catch(showError)}
async function deleteRow(i){const pk=columns.find(c=>c.COLUMN_KEY==='PRI');if(!pk)return showError(new Error('Delete requires a table with one primary key.'));const id=rows[i][pk.COLUMN_NAME];if(!confirm(`Delete ${selected} record ${pk.COLUMN_NAME}=${id}? This cannot be undone.`))return;try{await api(`/api/admin/database/tables/${encodeURIComponent(selected)}/rows/${encodeURIComponent(id)}`,{method:'DELETE'});loadTables();loadRows()}catch(e){showError(e)}}
loadTables();
</script>
</body>
</html>
