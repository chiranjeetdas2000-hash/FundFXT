        <section id="withdraw" class="view">
            <div class="head">
                <div>
                    <span class="eyebrow">Withdraw</span>
                    <h1>Request withdrawal</h1>
                    <p class="sub">Withdraw from your FundFXT Wallet. An active funded account is required.</p>
                </div>
            </div>
            <div class="panel form">
                <select id="wAccount">
                    <option value="">Select funded account</option>
                </select>
                <input id="wAmount" type="number" min="0.01" step="0.01" placeholder="Amount (USD)">
                <select id="wMethod">
                    <option value="UPI">UPI</option>
                    <option value="CRYPTO">CRYPTO</option>
                </select>
                <div id="wDetails"></div>
                <button class="btn primary" id="wSubmit" type="button">Submit withdrawal request</button>
                <div id="wMsg" class="message"></div>
            </div>
            <div class="panel" style="margin-top:16px;">
