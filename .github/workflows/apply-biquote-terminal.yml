name: Apply BiQuote terminal integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch terminal and BiQuote trade engine
        shell: python
        run: |
          from pathlib import Path

          p=Path('server-clean.js')
          s=p.read_text()
          marker='const biquoteTrading=`'
          if marker in s:
              a=s.index(marker)+len(marker)
              b=s.index('`;\ncleanTrading=',a)
              inner=s[a:b]
              inner=inner.replace('`','\\`')
              s=s[:a]+inner+s[b:]
          old="for(const raw of list){const p=normalizeBiQuoteTick(raw);if(!p||!SYMBOLS[p.symbol])continue;global.priceCache[p.symbol]=p;global.prices[p.symbol]=p;}\n  return global.prices;"
          new="for(const raw of list){const p=normalizeBiQuoteTick(raw);if(!p||!SYMBOLS[p.symbol])continue;global.priceCache[p.symbol]=p;global.prices[p.symbol]=p;}\n  if(!isForexWeekend()&&typeof processLivePrices==='function')processLivePrices().catch(e=>console.error('BiQuote trade engine:',e.message));\n  return global.prices;"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('terminal.html')
          s=p.read_text()
          s=s.replace('FCS live quotes','BiQuote live quotes')
          s=s.replace('TRADINGVIEW MARKET DATA','TRADINGVIEW CHART · BIQUOTE EXECUTION FEED')
          s=s.replace('TRADINGVIEW CHART · FCS EXECUTION FEED','TRADINGVIEW CHART · BIQUOTE EXECUTION FEED')
          s=s.replace('Quotes synced with FundFXT price feed','Quotes synced with BiQuote price feed')
          p.write_text(s)

          p=Path('terminal.js')
          s=p.read_text()
          s=s.replace("const DEFAULT_SYMBOLS=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCHF','USDCAD','NZDUSD','EURGBP','EURJPY','GBPJPY','XAUUSD','XAGUSD'];", "const DEFAULT_SYMBOLS=['EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','USDCAD','NZDUSD','EURGBP','EURJPY','EURAUD','EURCHF','EURNZD','GBPJPY','GBPCHF','GBPAUD','GBPNZD','AUDJPY','AUDNZD','AUDCAD','AUDCHF','CADJPY','CADCHF','CHFJPY','NZDJPY','NZDCHF','NZDCAD','XAUUSD','XAGUSD'];")
          s=s.replace("function tvSymbol(s){const aliases={XAUUSD:'OANDA:XAUUSD',XAGUSD:'OANDA:XAGUSD'};return aliases[s]||`FX:${s}`}" , "function tvSymbol(s){return `OANDA:${String(s||'EURUSD').toUpperCase()}`}")
          p.write_text(s)

          p=Path('terminal-polish.css')
          s=p.read_text()
          extra='''\n/* FundFXT terminal micro-interaction system: every visible text group lives in a styled surface. */\n.panel-title h2,.panel-title .muted,.selected-symbol,.selected-price,.chart-head .muted,.status,.field label,.trade-top b,.trade-top small,.trade-meta span,.trade-meta b,.right-tab,.quote-main b,.quote-main small,.quote-prices b,.quote-prices small,.acct small,.acct b,.top-center span,.top-center b,.brand,.empty strong,.empty span{position:relative;display:inline-block;transition:color .25s ease,background .25s ease,transform .25s ease,filter .25s ease;text-rendering:optimizeLegibility}\n.panel-title h2:hover,.selected-symbol:hover,.trade-top b:hover,.quote-main b:hover{transform:translateY(-1px);filter:brightness(1.08)}\n.panel-title .muted:hover,.chart-head .muted:hover,.status:hover,.field label:hover,.trade-top small:hover,.trade-meta span:hover,.quote-prices small:hover,.acct small:hover{color:#b7c5d1}\n.top-center span,.acct,.brand,.panel-title,.selected-price,.quote-prices,.trade-meta>div,.status,.field,.right-tab,.empty{border-radius:8px}\n.panel-title h2{padding:2px 6px;margin-left:-6px}.field label{padding:3px 6px;border:1px solid #263746;background:#0b1117;border-radius:6px}.status{padding:7px 10px!important;border:1px solid #1e303d;background:#0b1117}.selected-price{padding:3px 7px;border:1px solid #1c2a35;background:#0b1117;border-radius:6px}.acct{padding:4px 7px;border:1px solid #1c2a35;background:#0b1117;transition:.25s ease}.acct:hover{border-color:#35566d;transform:translateY(-1px);box-shadow:0 8px 20px #0003}.right-tab{transition:all .25s ease}.right-tab:hover{transform:translateY(-1px)}.quote-main small{padding:2px 5px;border-radius:999px;background:#0f1a21}.quote-prices{padding:5px 7px;border:1px solid #1b2a35;background:#091016}.quote-prices b{padding:2px 4px;border-radius:5px}.quote-prices b:hover{background:#16232c;transform:translateY(-1px)}.trade-meta>div{padding:6px;border:1px solid #1b2a35;background:#0b1117;transition:.25s ease}.trade-meta>div:hover{border-color:#345064;transform:translateY(-1px)}.empty{padding:14px;border:1px dashed #263746;background:#0b1117}.empty:hover{border-color:#3c596d;background:#0f171e}.mobile-nav button{position:relative}.mobile-nav button::after{content:\"\";position:absolute;left:50%;bottom:3px;width:0;height:2px;border-radius:99px;background:var(--fx-green);transform:translateX(-50%);transition:width .25s ease}.mobile-nav button:hover::after,.mobile-nav button.active::after{width:20px}\n'''
          if 'terminal micro-interaction system' not in s:
              p.write_text(s+extra)
      - name: Validate JavaScript
        run: |
          node --check server-clean.js
          node --check terminal.js
          node --check trade-engine-v2.js
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-clean.js terminal.html terminal.js terminal-polish.css trade-engine-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect all terminal pairs to OANDA TradingView charts"
          git push
