name: FundFXT Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean architecture
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const adminDir = 'frontend/admin';
          const htmlPath = path.join(adminDir, 'index.html');
          let html = fs.readFileSync(htmlPath, 'utf8');
          const style = html.match(/<style>([\s\S]*?)<\/style>/i);
          const script = html.match(/<script>([\s\S]*?)<\/script>/i);

          if (style) {
              fs.writeFileSync(path.join(adminDir, 'index.css'), style[1].trim() + '\n');
              html = html.replace(style[0], '<link rel="stylesheet" href="index.css">');
          }

          if (script) {
              let js = script[1].trim();
              js = js.replace(/const body=\{payment_link:link,razorpay_link:link\};/g, 'const body = { razorpay_link: link };');
              js = js.replace(/const orderLink=o=>field\(o,'razorpay_link','payment_link'\);/g, "const orderLink = o => field(o, 'razorpay_link');");
              fs.writeFileSync(path.join(adminDir, 'index.js'), js + '\n');
              html = html.replace(script[0], '<script src="index.js" defer></script>');
          }

          fs.writeFileSync(htmlPath, html);

          const serverPath = 'backend/server.js';
          let server = fs.readFileSync(serverPath, 'utf8');

          // Repair the malformed trade query exactly as it exists in the source.
          server = server.replace(
              /const \[trades\] = await db\.execute\('SELECT \* FROM trades WHERE trade_id = \? AND user_id = \? AND status = "OPEN", \[req\.params\.tradeId, req\.userId\]\);/g,
              "const [trades] = await db.execute(\"SELECT * FROM trades WHERE trade_id = ? AND user_id = ? AND status = 'OPEN'\", [req.params.tradeId, req.userId]);"
          );

          // Replace the complete legacy payment verification/request section.
          server = server.replace(
              /\/\/ ========== RAZORPAY PAYMENT VERIFY ==========[\s\S]*?\/\/ ========== ADMIN AUTH \(UNCHANGED\) ==========\n/,
              `// ========== PAYMENT REQUEST ==========\n\napp.post('/api/payments/request', authenticateToken, async (req, res) => {\n    const { model, affiliate_code } = req.body || {};\n\n    try {\n        const pricing = await calculateServerPrice(model, affiliate_code);\n        const [users] = await db.execute(\n            'SELECT id, legal_name, email, phone FROM users WHERE id = ? LIMIT 1',\n            [req.userId]\n        );\n\n        if (!users.length) {\n            return res.status(404).json({ error: 'User not found' });\n        }\n\n        const user = users[0];\n        const requestId = generateRequestRef();\n        const affiliateId = pricing.affiliate_user_id || null;\n\n        await db.execute(\n            \`INSERT INTO payment_orders (\n                request_id, user_id, provider, razorpay_link, model, affiliate_code,\n                affiliate_id, original_amount_cents, discount_amount_cents,\n                final_amount_cents, paid_amount_cents, currency, status, created_at, updated_at\n            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, NOW(), NOW())\`,\n            [\n                requestId, user.id, 'RAZORPAY', null, pricing.model,\n                pricing.affiliateApplied ? affiliate_code : null, affiliateId,\n                pricing.originalAmountCents, pricing.discountAmountCents,\n                pricing.finalAmountCents, 0, pricing.currency, 'REQUESTED'\n            ]\n        );\n\n        await sendEmail(\n            'support.fundfxt@gmail.com',\n            \`FundFXT Payment Request \${requestId}\`,\n            \`<h2>New FundFXT Payment Request</h2><p><strong>Request ID:</strong> \${requestId}</p><p><strong>Name:</strong> \${user.legal_name}</p><p><strong>Email:</strong> \${user.email}</p><p><strong>Challenge:</strong> \${pricing.model}</p><p><strong>Payable:</strong> \${(pricing.finalAmountCents / 100).toFixed(2)} \${pricing.currency}</p><p><strong>Affiliate:</strong> \${affiliate_code || 'None'}</p><p>Please create and send a Razorpay Payment Link.</p>\`\n        ).catch(error => console.error('Payment request email failed:', error.message));\n\n        return res.json({\n            success: true,\n            request_id: requestId,\n            request_ref: requestId,\n            status: 'REQUESTED',\n            manual_payment: true,\n            pricing\n        });\n    } catch (error) {\n        console.error('Payment request error:', error);\n        return res.status(500).json({ error: error.message });\n    }\n});\n\n// ========== ADMIN AUTH ==========\n`);

          // Canonical database names.
          server = server.replace(/\border_ref\b/g, 'request_id');
          server = server.replace(/\bpayment_link\b/g, 'razorpay_link');
          server = server.replace(/\bpayout_requests\b/g, 'withdrawal_request');
          server = server.replace(/"(REQUESTED|PAYMENT_PENDING|PAYMENT_DONE|PAYMENT_APPROVED|REJECTED|CANCELLED|ACCOUNT_CREATED|LINK_SENT)"/g, "'$1'");

          // Remove the duplicate admin payment-request listing/reject/link section.
          server = server.replace(
              /\/\/ Get payment requests \(for dashboard\)[\s\S]*?\/\/ Get withdrawals/g,
              '// Get withdrawals'
          );

          fs.writeFileSync(serverPath, server);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start = 'node backend/server.js';
          pkg.scripts.test = 'node --check backend/server.js && node --check frontend/admin/index.js';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Validate
        run: |
          node --check backend/server.js
          node --check frontend/admin/index.js
          test -f frontend/admin/index.css
          grep -q 'src="index.js"' frontend/admin/index.html

      - name: Commit
        run: |
          git config user.name "FundFXT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/admin/index.html frontend/admin/index.css frontend/admin/index.js backend/server.js package.json
          git rm -f backend/boot.js backend/start.js || true
          git add -A
          git commit -m "refactor: one admin js css and one backend server"
          git push

      - name: Remove workflow
        run: |
          git config user.name "FundFXT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fundfxt-cleanup.yml
          git commit -m "chore: remove temporary cleanup workflow"
          git push
