name: FundFXT Architecture Cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refactor files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const admin = path.join('frontend', 'admin');
          const htmlPath = path.join(admin, 'index.html');
          let html = fs.readFileSync(htmlPath, 'utf8');

          const styleMatch = html.match(/<style>([\s\S]*?)<\/style>/i);
          const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/i);

          if (styleMatch && scriptMatch) {
              fs.writeFileSync(path.join(admin, 'index.css'), styleMatch[1].trim() + '\n');
              fs.writeFileSync(path.join(admin, 'index.js'), scriptMatch[1].trim() + '\n');
              html = html.replace(styleMatch[0], '<link rel="stylesheet" href="index.css">');
              html = html.replace(scriptMatch[0], '<script src="index.js" defer></script>');
              fs.writeFileSync(htmlPath, html);
          }

          const serverPath = path.join('backend', 'server.js');
          let server = fs.readFileSync(serverPath, 'utf8');

          server = server.replace(
              /\/\/ ========== RAZORPAY PAYMENT VERIFY ==========[\s\S]*?\/\/ ========== ADMIN AUTH \(UNCHANGED\) ==========\n/,
              `// ========== PAYMENT REQUEST ==========\n\napp.post('/api/payments/request', authenticateToken, async (req, res) => {\n    const { model, affiliate_code } = req.body || {};\n\n    try {\n        const pricing = await calculateServerPrice(model, affiliate_code);\n        const [users] = await db.execute(\n            'SELECT id, legal_name, email, phone FROM users WHERE id = ? LIMIT 1',\n            [req.userId]\n        );\n\n        if (!users.length) {\n            return res.status(404).json({ error: 'User not found' });\n        }\n\n        const user = users[0];\n        const requestId = generateRequestRef();\n        const affiliateId = pricing.affiliate_user_id || null;\n\n        await db.execute(\n            \`INSERT INTO payment_orders (request_id, user_id, provider, razorpay_link, model, affiliate_code, affiliate_id, original_amount_cents, discount_amount_cents, final_amount_cents, paid_amount_cents, currency, status, created_at, updated_at)\n             VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, NOW(), NOW())\`,\n            [requestId, user.id, 'RAZORPAY', null, pricing.model, pricing.affiliateApplied ? affiliate_code : null, affiliateId, pricing.originalAmountCents, pricing.discountAmountCents, pricing.finalAmountCents, 0, pricing.currency, 'REQUESTED']\n        );\n\n        await sendEmail(\n            'support.fundfxt@gmail.com',\n            \`FundFXT Payment Request \${requestId}\`,\n            \`<h2>New FundFXT Payment Request</h2><p><strong>Request ID:</strong> \${requestId}</p><p><strong>Name:</strong> \${user.legal_name}</p><p><strong>Email:</strong> \${user.email}</p><p><strong>Challenge:</strong> \${pricing.model}</p><p><strong>Payable:</strong> \${(pricing.finalAmountCents / 100).toFixed(2)} \${pricing.currency}</p><p><strong>Affiliate:</strong> \${affiliate_code || 'None'}</p><p>Please create and send a Razorpay Payment Link.</p>\`\n        ).catch(error => console.error('Payment request email failed:', error.message));\n\n        return res.json({ success: true, request_id: requestId, request_ref: requestId, status: 'REQUESTED', manual_payment: true, pricing });\n    } catch (error) {\n        console.error('Payment request error:', error);\n        return res.status(500).json({ error: error.message });\n    }\n});\n\n// ========== ADMIN AUTH ==========\n`);

          server = server.replace(/\border_ref\b/g, 'request_id');
          server = server.replace(/\bpayment_link\b/g, 'razorpay_link');
          server = server.replace(/\bpayout_requests\b/g, 'withdrawal_request');
          server = server.replace(/"(REQUESTED|PAYMENT_PENDING|PAYMENT_DONE|PAYMENT_APPROVED|REJECTED|CANCELLED|ACCOUNT_CREATED|LINK_SENT)"/g, "'$1'");

          server = server.replace(
              /\/\/ Get payment requests \(for dashboard\)[\s\S]*?\/\/ Get withdrawals/,
              '// Get withdrawals'
          );

          server = server.replace(/\bprovider_order_id\b/g, 'razorpay_provider_reference');
          server = server.replace(/\bprovider_payment_id\b/g, 'razorpay_payment_reference');

          fs.writeFileSync(serverPath, server);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start = 'node backend/server.js';
          pkg.scripts.test = 'node --check backend/server.js && node --check frontend/admin/index.js';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Validate
        run: |
          node --check backend/server.js
          node --check frontend/admin/index.js

      - name: Commit cleanup
        run: |
          git config user.name "FundFXT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/admin/index.html frontend/admin/index.css frontend/admin/index.js backend/server.js package.json
          git rm -f backend/boot.js backend/start.js || true
          git add -A
          git commit -m "refactor: one admin js css and one backend server" || exit 0
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "FundFXT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fundfxt-cleanup.yml || true
          git commit -m "chore: remove temporary cleanup workflow" || true
          git push || true
