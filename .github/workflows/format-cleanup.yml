name: FundFXT Format Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format source files
        run: |
          npx --yes prettier@3 --write backend/server.js frontend/admin/index.js frontend/admin/index.css frontend/admin/index.html package.json
          node --check backend/server.js
          node --check frontend/admin/index.js
      - name: Commit formatted source
        run: |
          git config user.name "FundFXT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js frontend/admin/index.js frontend/admin/index.css frontend/admin/index.html package.json
          git commit -m "style: format FundFXT source files" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "FundFXT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/format-cleanup.yml
          git commit -m "chore: remove formatting workflow"
          git push
