name: Repair legacy server
on:
  push:
    paths:
      - '.github/workflows/repair-legacy-server.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair server.js and remove helper workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          s=s.replace("status = 'OPEN''", 'status = "OPEN"')
          p.write_text(s)
          w=Path('.github/workflows/repair-legacy-server.yml')
          w.unlink()
          PY
          git config user.name 'FundFXT Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js .github/workflows/repair-legacy-server.yml
          git commit -m 'Repair legacy server SQL quoting'
          git push
