name: FundFXT terminal validation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check server-clean.js
          node --check trade-engine-v2.js
          node --check terminal.js
      - name: Verify terminal architecture
        run: |
          test -f terminal.html
          test -f terminal.css
          test -f terminal-polish.css
          test -f terminal-fix.css
          grep -q "tradingview.com/widgetembed" terminal.js
          grep -q "/api/trade/get?account_code=" terminal.js
          grep -q "fundfxt_chart_height" terminal.js
          grep -q "candlestick-chart" terminal.html
          grep -q "lucide" terminal.html
