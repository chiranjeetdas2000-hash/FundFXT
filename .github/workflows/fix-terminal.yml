name: FundFXT consistency fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[terminal-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch terminal
        run: python scripts/patch_terminal.py
      - name: Validate JavaScript
        run: |
          node --check server-clean.js
          node --check trade-engine-v2.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('terminal.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/terminal-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/terminal-inline.js
      - name: Commit terminal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: synchronize terminal trades [terminal-fix-bot]"
          git push
