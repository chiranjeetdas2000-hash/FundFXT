name: FundFXT terminal validation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check server-clean.js
          node --check trade-engine-v2.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('terminal.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/terminal-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/terminal-inline.js
      - name: Verify terminal architecture
        run: |
          grep -q "lightweight-charts" terminal.html
          grep -q "/api/trade/get?account_code=" terminal.html
          grep -q "Only this account's positions" terminal.html
