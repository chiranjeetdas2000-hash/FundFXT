name: Refine quote layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-quote-layout.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quote layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('terminal.js')
          s=p.read_text()
          start=s.index('function renderQuotes(){')
          end=s.index('\nfunction renderSelectedPrice()', start)
          fn="""function renderQuotes(){const box=$('watchlist');if(!box)return;const term=($('search')?.value||'').trim().toLowerCase();const q=S.symbols.filter(s=>String(s).toLowerCase().includes(term));box.innerHTML=q.map(s=>{const p=S.prices[s]||{},bid=Number(p.bid),ask=Number(p.ask),live=Number.isFinite(bid)&&Number.isFinite(ask),spread=live?(Number.isFinite(Number(p.spread))?Number(p.spread):Math.abs(ask-bid)):null,state=String(p.marketState||'open').toLowerCase(),stale=Boolean(p.stale);return `<button class=\"quote ${s===S.selected?'selected':''}\" data-symbol=\"${s}\"><span class=\"quote-main\"><b>${s}</b><small>${live&&!stale&&state!=='closed'?'LIVE':'MARKET CLOSED'}</small><em>Spread ${price(spread,s)}</em></span><span class=\"quote-prices\"><span class=\"quote-side bid-side\"><label>BID</label><b>${price(bid,s)}</b></span><span class=\"quote-side ask-side\"><label>ASK</label><b>${price(ask,s)}</b></span></span></button>`}).join('')||'<div class=\"empty\"><strong>No symbols found</strong><span>Try another pair name.</span></div>';box.querySelectorAll('.quote').forEach(x=>x.onclick=()=>{S.selected=x.dataset.symbol;renderQuotes();renderSelectedPrice();renderButtons();showPanel('center');loadTV()})}
"""
          p.write_text(s[:start]+fn+s[end+1:])
          css=Path('terminal-polish.css')
          c=css.read_text()
          c += '''\n/* Clean market-watch quote layout: pair + spread left, Bid/Ask right. */\n.quote{grid-template-columns:minmax(90px,1fr) minmax(150px,auto)!important;min-height:68px!important;padding:9px 12px!important;gap:12px!important}\n.quote-main{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;text-align:left!important;gap:2px!important}\n.quote-main b{color:#fff!important;font-size:14px!important;font-weight:800!important;letter-spacing:.2px!important}\n.quote-main small{font-size:7px!important;color:#738492!important;letter-spacing:.7px!important;text-transform:uppercase!important}\n.quote-main em{font-style:normal!important;font-size:8px!important;color:#a6b3bd!important;margin-top:2px!important;letter-spacing:.15px!important}\n.quote-prices{display:grid!important;grid-template-columns:repeat(2,minmax(70px,1fr))!important;gap:8px!important;padding:0!important;border:0!important;background:transparent!important}\n.quote-side{display:flex!important;flex-direction:column!important;align-items:flex-end!important;justify-content:center!important;min-width:70px!important;padding:7px 9px!important;border:1px solid #1b2a35!important;background:#091016!important;border-radius:7px!important}\n.quote-side label{font-size:7px!important;font-weight:800!important;letter-spacing:1px!important;color:#71818e!important;margin-bottom:4px!important}\n.quote-side b{font-size:12px!important;font-weight:800!important;line-height:1!important;white-space:nowrap!important;font-variant-numeric:tabular-nums!important;transition:color .2s ease,transform .2s ease!important}\n.bid-side b{color:var(--fx-red)!important}.ask-side b{color:var(--fx-green)!important}\n.quote:hover .quote-side,.quote.selected .quote-side{border-color:#345064!important}\n.quote-side b:hover{transform:translateY(-1px)!important}\n@media(max-width:820px){.quote{grid-template-columns:minmax(82px,1fr) minmax(148px,auto)!important;min-height:72px!important}.quote-prices{grid-template-columns:repeat(2,70px)!important}.quote-side{min-width:0!important;padding:7px!important}.quote-side b{font-size:10px!important}.quote-main b{font-size:12px!important}}\n@media(max-width:430px){.quote{grid-template-columns:minmax(65px,1fr) minmax(142px,auto)!important;padding:8px 9px!important}.quote-prices{grid-template-columns:repeat(2,67px)!important;gap:6px!important}.quote-side b{font-size:9px!important}.quote-side label{font-size:6px!important}.quote-main b{font-size:11px!important}.quote-main em{font-size:7px!important}}\n'''
          css.write_text(c)
          PY
      - name: Validate
        run: node --check terminal.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terminal.js terminal-polish.css
          git diff --cached --quiet || git commit -m 'Polish terminal bid ask quote cards [skip ci]'
          git push
