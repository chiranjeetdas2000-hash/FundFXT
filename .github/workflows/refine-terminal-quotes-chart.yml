name: Refine terminal quote visibility and TradingView iframe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-terminal-quotes-chart.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch terminal UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('terminal.js')
          s=p.read_text()
          pattern=r'function renderQuotes\(\)\{.*?\n\}\nfunction renderSelectedPrice'
          replacement=r'''function renderQuotes(){
            const box=$('watchlist');if(!box)return;
            const term=($('search')?.value||'').trim().toLowerCase();
            const q=S.symbols.filter(s=>String(s).toLowerCase().includes(term));
            box.innerHTML=q.map(s=>{
              const p=S.prices[s]||{},bid=Number(p.bid),ask=Number(p.ask),mid=Number(p.mid);
              const last=Number.isFinite(mid)?mid:(Number.isFinite(bid)&&Number.isFinite(ask)?(bid+ask)/2:NaN);
              const live=Number.isFinite(bid)&&Number.isFinite(ask);
              const spread=live?(Number.isFinite(Number(p.spread))?Number(p.spread):Math.abs(ask-bid)):null;
              const spPct=live&&Number.isFinite(Number(p.spreadPercent))?Number(p.spreadPercent):(live&&Number.isFinite(last)&&last?spread/last*100:null);
              const ch=Number(p.changePercent),state=String(p.marketState||'open').toLowerCase(),stale=Boolean(p.stale);
              const liveText=live&&!stale&&state!=='closed'?'LIVE':'CLOSED';
              const changeText=Number.isFinite(ch)?(ch>=0?'+':'')+ch.toFixed(2)+'%':'—';
              return `<button class="quote ${s===S.selected?'selected':''}" data-symbol="${s}">
                <span class="quote-main"><b>${s}</b><small class="quote-state ${liveText==='LIVE'?'is-live':''}">${liveText}</small></span>
                <span class="quote-last"><label>LAST</label><b>${price(last,s)}</b></span>
                <span class="quote-cell bid-cell"><label>BID</label><b>${price(bid,s)}</b></span>
                <span class="quote-cell ask-cell"><label>ASK</label><b>${price(ask,s)}</b></span>
                <span class="quote-cell spread-cell"><label>SPREAD</label><b>${price(spread,s)}</b>${Number.isFinite(spPct)?`<small>${spPct.toFixed(3)}%</small>`:''}</span>
                <span class="quote-cell change-cell"><label>CHANGE</label><b class="${Number.isFinite(ch)&&ch<0?'negative':'positive'}">${changeText}</b></span>
              </button>`
            }).join('')||'<div class="empty"><strong>No symbols found</strong><span>Try another pair name.</span></div>';
            box.querySelectorAll('.quote').forEach(x=>x.onclick=()=>{S.selected=x.dataset.symbol;renderQuotes();renderSelectedPrice();renderButtons();showPanel('center');loadTV()})
          }
          function renderSelectedPrice'''
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderQuotes target not found')
          p.write_text(ns)

          p=Path('terminal-polish.css')
          css=p.read_text()
          css += r'''

/* Quote board: high-visibility professional market-watch layout */
.watchlist{padding:6px 8px 18px!important}
.quote{display:grid!important;grid-template-columns:minmax(72px,1.15fr) minmax(72px,.9fr) minmax(82px,1fr) minmax(82px,1fr) minmax(82px,1fr) minmax(70px,.85fr)!important;min-height:72px!important;padding:9px 10px!important;gap:7px!important;border-radius:10px!important}
.quote-main,.quote-last,.quote-cell{display:flex!important;flex-direction:column!important;justify-content:center!important;min-width:0!important;text-align:right!important}
.quote-main{text-align:left!important;align-items:flex-start!important}
.quote-main b{font-size:13px!important;font-weight:800!important;letter-spacing:.2px}
.quote-main small{font-size:8px!important;margin-top:5px!important;padding:2px 6px!important;border:1px solid #263746!important;color:#8b9aa7!important}
.quote-state.is-live{color:#00d084!important;border-color:#155d46!important;background:#08251b!important}
.quote-last label,.quote-cell label{font-size:7px!important;font-weight:800!important;letter-spacing:.8px!important;color:#6f808d!important;margin-bottom:4px!important}
.quote-last b,.quote-cell b{font-size:11px!important;font-weight:800!important;white-space:nowrap!important}
.quote-last{padding:6px 8px!important;border:1px solid #1b2a35!important;background:#0a1218!important;border-radius:7px!important}
.quote-cell{padding:5px 7px!important;border:1px solid #1b2a35!important;background:#091016!important;border-radius:7px!important}
.bid-cell b{color:var(--fx-red)!important}.ask-cell b{color:var(--fx-green)!important}
.spread-cell b{color:#d7e1e8!important}.spread-cell small{font-size:7px!important;color:#7f909d!important;margin-top:2px!important}
.change-cell b.positive{color:var(--fx-green)!important}.change-cell b.negative{color:var(--fx-red)!important}
.quote:hover .quote-cell,.quote.selected .quote-cell{border-color:#345064!important}
@media(max-width:1180px){.quote{grid-template-columns:minmax(70px,1.1fr) repeat(5,minmax(68px,1fr))!important}}
@media(max-width:900px) and (min-width:821px){.quote{grid-template-columns:1fr 1fr 1fr!important}.quote-main{grid-column:1/-1;flex-direction:row!important;align-items:center!important;justify-content:space-between!important}.quote-last{display:none!important}}
@media(max-width:820px){.quote{grid-template-columns:minmax(74px,1.05fr) repeat(2,minmax(72px,1fr))!important;grid-template-rows:auto auto!important;min-height:92px!important;gap:6px!important}.quote-main{grid-row:1/-1}.quote-last{grid-column:2;grid-row:1}.spread-cell{grid-column:3;grid-row:1}.bid-cell{grid-column:2;grid-row:2}.ask-cell{grid-column:3;grid-row:2}.change-cell{display:none!important}.quote-main b{font-size:12px!important}.quote-last b,.quote-cell b{font-size:10px!important}.quote-last label,.quote-cell label{font-size:6px!important}.quote-prices{display:none!important}}
@media(max-width:430px){.quote{grid-template-columns:minmax(68px,1fr) repeat(2,minmax(68px,1fr))!important;padding:8px!important}.quote-main b{font-size:11px!important}.quote-last b,.quote-cell b{font-size:9px!important}}

/* Direct TradingView iframe: chart is display-only and follows selected quote pair. */
.tv-wrap{width:100%!important;height:100%!important;min-height:320px!important;overflow:hidden!important;background:#0b0f14!important}
.tv-wrap iframe{width:100%!important;height:100%!important;min-height:320px!important;display:block!important;border:0!important}
'''
          p.write_text(css)
          PY
      - name: Validate
        run: |
          node --check terminal.js
      - name: Commit
        run: |
          git config user.name 'FundFXT Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terminal.js terminal-polish.css
          git diff --cached --quiet && exit 0
          git commit -m 'Improve quote visibility and direct TradingView iframe [skip ci]'
          git push
