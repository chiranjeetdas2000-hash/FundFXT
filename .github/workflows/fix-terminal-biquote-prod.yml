name: Fix FundFXT terminal and production market feed

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-terminal-biquote-prod.yml'

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'BiQuote production fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch production backend and terminal
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------- SERVER: remove legacy FCS feed and install BiQuote ----------
          p = Path('server.js')
          s = p.read_text()
          s = s.replace("const FCSClient = require('./fcs-client-lib'); // Official FCS library\n", "")

          start = s.find('// ========== FCS LIVE MARKET DATA ==========')
          end = s.find('// ========== TRADE ENGINE ==========')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate FCS block')

          biquote = r'''// ========== BIQUOTE LIVE MARKET DATA ==========
          const BIQUOTE_BASE = 'https://biquote.io';
          const BIQUOTE_SYMBOLS = [
              'EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','USDCAD','NZDUSD',
              'EURGBP','EURJPY','EURAUD','EURCHF','EURNZD','GBPJPY','GBPCHF','GBPAUD','GBPNZD',
              'AUDJPY','AUDNZD','AUDCAD','AUDCHF','CADJPY','CADCHF','CHFJPY','NZDJPY','NZDCHF','NZDCAD',
              'XAUUSD','XAGUSD'
          ];
          global.prices = global.prices || {};
          global.priceCache = global.priceCache || {};

          function isForexWeekend() {
              const d = new Date().getUTCDay();
              return d === 0 || d === 6;
          }

          function normalizeBiQuoteTick(t) {
              if (!t || !t.symbol) return null;
              const symbol = String(t.symbol).toUpperCase();
              const bid = Number(t.bid), ask = Number(t.ask), mid = Number(t.mid);
              if (!Number.isFinite(bid) || !Number.isFinite(ask)) return null;
              const m = Number.isFinite(mid) ? mid : (bid + ask) / 2;
              const spread = Number.isFinite(Number(t.spread)) ? Number(t.spread) : Math.abs(ask - bid);
              const dayPct = Number(t.dayDiffPercent ?? t.changePercent ?? t.chp);
              const change = Number(t.changeAmount ?? t.change ?? t.ch);
              return {
                  symbol, bid, ask, mid: m,
                  // BiQuote documents last=0 for FX/CFD; mid is the usable last/single price.
                  last: Number.isFinite(Number(t.last)) && Number(t.last) !== 0 ? Number(t.last) : m,
                  spread,
                  spreadPercent: m ? (spread / m) * 100 : 0,
                  change: Number.isFinite(change) ? change : (Number.isFinite(dayPct) ? m * dayPct / 100 : 0),
                  changePercent: Number.isFinite(dayPct) ? dayPct : 0,
                  marketState: t.marketState || 'open',
                  stale: Boolean(t.stale),
                  quoteAgeSeconds: Number(t.quoteAgeSeconds || 0),
                  updatedAt: Date.now(),
                  source: 'BiQuote'
              };
          }

          async function refreshBiQuotePrices() {
              const qs = BIQUOTE_SYMBOLS.map(x => 'symbols=' + encodeURIComponent(x)).join('&');
              const r = await fetch(BIQUOTE_BASE + '/api/latest?' + qs, { headers: { accept: 'application/json' } });
              if (!r.ok) throw new Error('BiQuote HTTP ' + r.status);
              const body = await r.json();
              const ticks = Array.isArray(body) ? body :
                  (Array.isArray(body.ticks) ? body.ticks :
                  (Array.isArray(body.data) ? body.data : []));
              const source = body && body.data && typeof body.data === 'object' && !Array.isArray(body.data) ? body.data : body;
              const list = ticks.length ? ticks : Object.entries(source || {}).map(([symbol, t]) => ({ ...(t || {}), symbol: (t && t.symbol) || symbol }));
              for (const raw of list) {
                  const q = normalizeBiQuoteTick(raw);
                  if (!q || !BIQUOTE_SYMBOLS.includes(q.symbol)) continue;
                  global.prices[q.symbol] = q;
                  global.priceCache[q.symbol] = q;
              }
              // Quotes remain available when the market is closed, but the trade engine must not mutate positions on weekends.
              if (!isForexWeekend() && typeof processLivePrices === 'function') {
                  processLivePrices().catch(e => console.error('BiQuote trade engine:', e.message));
              }
              return global.prices;
          }

          refreshBiQuotePrices().then(() => console.log('BiQuote feed connected')).catch(e => console.error('BiQuote initial fetch failed:', e.message));
          setInterval(() => refreshBiQuotePrices().catch(e => console.error('BiQuote refresh failed:', e.message)), 1000);

          // Terminal market-data endpoint. Authenticated because the terminal is account-bound.
          app.get('/api/prices', authenticateToken, (req, res) => {
              res.json({ success: true, source: 'BiQuote', symbols: BIQUOTE_SYMBOLS, prices: global.prices || {} });
          });

          // Same account-scoped trade fetch used by the Account Dashboard.
          app.get('/api/trade/get', authenticateToken, async (req, res) => {
              try {
                  const accountCode = String(req.query.account_code || '').trim();
                  if (!accountCode) return res.status(400).json({ success: false, error: 'account_code is required' });
                  const [accounts] = await db.execute(
                      'SELECT id, account_code FROM accounts WHERE account_code = ? AND user_id = ? LIMIT 1',
                      [accountCode, req.userId]
                  );
                  if (!accounts.length) return res.status(404).json({ success: false, error: 'Account not found' });
                  const [trades] = await db.execute(
                      'SELECT * FROM trades WHERE account_id = ? ORDER BY COALESCE(entry_time, created_at) DESC, id DESC',
                      [accounts[0].id]
                  );
                  res.json({ success: true, account_code: accountCode, trades });
              } catch (e) {
                  console.error('Trade fetch error:', e.message);
                  res.status(500).json({ success: false, error: e.message });
              }
          });

          '''
          s = s[:start] + biquote + s[end:]

          # Replace the narrow legacy instrument map with the complete FundFXT instrument set.
          inst_start = s.find('const instruments = {')
          inst_end = s.find('\n};', inst_start)
          if inst_start < 0 or inst_end < 0:
              raise SystemExit('Could not locate instruments')
          inst_end += 3
          instruments = '''const instruments = {
              EURUSD:{pip:0.0001,size:100000}, GBPUSD:{pip:0.0001,size:100000}, USDCHF:{pip:0.0001,size:100000},
              AUDUSD:{pip:0.0001,size:100000}, USDCAD:{pip:0.0001,size:100000}, NZDUSD:{pip:0.0001,size:100000},
              EURGBP:{pip:0.0001,size:100000}, EURJPY:{pip:0.01,size:100000}, EURAUD:{pip:0.0001,size:100000},
              EURCHF:{pip:0.0001,size:100000}, EURNZD:{pip:0.0001,size:100000}, GBPJPY:{pip:0.01,size:100000},
              GBPCHF:{pip:0.0001,size:100000}, GBPAUD:{pip:0.0001,size:100000}, GBPNZD:{pip:0.0001,size:100000},
              AUDJPY:{pip:0.01,size:100000}, AUDNZD:{pip:0.0001,size:100000}, AUDCAD:{pip:0.0001,size:100000},
              AUDCHF:{pip:0.0001,size:100000}, CADJPY:{pip:0.01,size:100000}, CADCHF:{pip:0.0001,size:100000},
              CHFJPY:{pip:0.01,size:100000}, NZDJPY:{pip:0.01,size:100000}, NZDCHF:{pip:0.0001,size:100000},
              NZDCAD:{pip:0.0001,size:100000}, USDJPY:{pip:0.01,size:100000}, XAUUSD:{pip:0.01,size:100}, XAGUSD:{pip:0.001,size:5000}
          };'''
          s = s[:inst_start] + instruments + s[inst_end:]

          # Allow every instrument above rather than the old five-symbol validation.
          old = "if (!['EURUSD', 'GBPUSD', 'USDJPY', 'AUDUSD', 'XAUUSD'].includes(symbol)) {"
          s = s.replace(old, 'if (!Object.prototype.hasOwnProperty.call(instruments, symbol)) {')

          p.write_text(s)

          # ---------- TERMINAL: account-scoped trades + reliable chart widget ----------
          p = Path('terminal.js')
          t = p.read_text()

          # Make the selected account explicit; never silently switch to another account when a code is supplied.
          t = t.replace("const a=list.find(x=>x.account_code===requested)||list[0];if(!a)throw Error('No trading account available');",
                        "const a=requested?list.find(x=>x.account_code===requested):list[0];if(!a)throw Error(requested?'Selected trading account not found':'No trading account available');")

          # Keep all returned trades and make the last account trade immediately visible when Open is empty.
          t = t.replace("const S={account:null,prices:{},symbols:[...DEFAULT_SYMBOLS],selected:'EURUSD',tab:'OPEN',timer:null,trades:[],refreshing:false,chartHeight:null};",
                        "const S={account:null,prices:{},symbols:[...DEFAULT_SYMBOLS],selected:'EURUSD',tab:'OPEN',timer:null,trades:[],refreshing:false,chartHeight:null};")
          old_visible = "function visibleTrades(){return S.trades.filter(t=>S.tab==='OPEN'?t.status==='OPEN':S.tab==='PENDING'?t.status==='PENDING':t.status==='CLOSED')}"
          new_visible = "function visibleTrades(){const filtered=S.trades.filter(t=>S.tab==='OPEN'?t.status==='OPEN':S.tab==='PENDING'?t.status==='PENDING':t.status==='CLOSED');if(S.tab==='OPEN'&&filtered.length===0&&S.trades.length)return S.trades.slice(0,1);return filtered}"
          t = t.replace(old_visible, new_visible)

          # Replace iframe creation with the official TradingView Advanced Chart iframe endpoint and explicit sizing.
          a = t.find('function loadTV(){')
          b = t.find('\nasync function loadTrades()', a)
          if a < 0 or b < 0:
              raise SystemExit('Could not locate loadTV/loadTrades')
          chart = r'''function loadTV(){
              const host=$('tv');if(!host)return;
              const symbol=tvSymbol(S.selected);
              const interval=document.querySelector('.tf.active')?.dataset.interval||'15';
              host.innerHTML='';
              const frame=document.createElement('iframe');
              frame.title=`FundFXT TradingView ${S.selected}`;
              frame.setAttribute('aria-label',`TradingView chart for ${S.selected}`);
              frame.setAttribute('allowfullscreen','true');
              frame.style.cssText='display:block;width:100%;height:100%;min-height:320px;border:0;background:#0b0f14;';
              frame.loading='eager';
              frame.src='https://www.tradingview.com/widgetembed/?symbol='+encodeURIComponent(symbol)+'&interval='+encodeURIComponent(interval)+'&theme=dark&style=1&locale=en&toolbar_bg=%230b0f14&enable_publishing=false&hide_top_toolbar=false&hide_side_toolbar=false&save_image=false&hide_legend=false&withdateranges=true&details=true&hotlist=true&calendar=false&allow_symbol_change=true&autosize=true&support_host=https%3A%2F%2Fwww.tradingview.com';
              frame.onload=()=>{$('chartFallback')?.classList.add('hidden')};
              frame.onerror=()=>{$('chartFallback')?.classList.remove('hidden');toast(`TradingView chart failed to load for ${S.selected}`)};
              host.appendChild(frame);
              $('chartFallback')?.classList.add('hidden');
              applyChartHeight();
          }'''
          t = t[:a] + chart + t[b:]

          # Show richer quote metadata in the selected header: Bid, Ask, Spread and percentage change.
          old_rp = "$('selectedPrice').textContent=`Last ${price(last,S.selected)}  •  Bid ${price(p.bid,S.selected)}  •  Ask ${price(p.ask,S.selected)}  •  Spread ${price(Number(p.ask)-Number(p.bid),S.selected)}  •  Change ${Number.isFinite(Number(p.changePercent))?(Number(p.changePercent)>=0?'+':'')+Number(p.changePercent).toFixed(2)+'%':'—'}`;"
          new_rp = "const spr=Number.isFinite(Number(p.spread))?Number(p.spread):(Number.isFinite(Number(p.bid))&&Number.isFinite(Number(p.ask))?Number(p.ask)-Number(p.bid):NaN);const cp=Number(p.changePercent);$('selectedPrice').textContent=`Last ${price(last,S.selected)}  •  Bid ${price(p.bid,S.selected)}  •  Ask ${price(p.ask,S.selected)}  •  Spread ${price(spr,S.selected)}  •  Change ${Number.isFinite(cp)?(cp>=0?'+':'')+cp.toFixed(2)+'%':'—'}`;"
          t = t.replace(old_rp, new_rp)

          p.write_text(t)
          PY

      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check terminal.js

      - name: Commit fixes
        run: |
          git config user.name 'FundFXT Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js terminal.js
          git diff --cached --quiet && exit 0
          git commit -m 'BiQuote production fix: terminal trades and chart [skip ci]'
          git push
