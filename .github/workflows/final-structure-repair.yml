name: Final FundFXT Structure Repair

on:
  push:
    branches: [main]

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply final FundFXT structure repair') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair backend structure
        run: python scripts/repair-final-structure.py

      - name: Validate JavaScript
        run: node --check backend/server.js

      - name: Commit repaired backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          if git diff --cached --quiet; then
            echo 'No repair changes needed'
            exit 0
          fi
          git commit -m 'Apply final FundFXT structure repair'
          git push
