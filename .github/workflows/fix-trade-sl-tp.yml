name: Fix trade SL TP backend
on:
  push:
    paths:
      - '.github/workflows/fix-trade-sl-tp.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix OPEN status SQL quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old='status = \\"OPEN\\"'
          new="status = 'OPEN'"
          count=s.count(old)
          if count == 0:
              raise SystemExit('Target SQL quoting pattern not found')
          p.write_text(s.replace(old,new))
          print(f'Fixed {count} occurrence(s)')
          PY
      - name: Commit backend fix
        run: |
          git config user.name 'FundFXT Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.js
          git commit -m 'Fix trade SL TP OPEN status SQL'
          git push
