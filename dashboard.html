<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundFXT | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">FundFXT</div>
            <nav>
                <a href="dashboard.html" class="active"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="#"><i class="fa-solid fa-wallet"></i> My Accounts</a>
                <a href="#"><i class="fa-solid fa-store"></i> Marketplace</a>
                <a href="#"><i class="fa-solid fa-share-nodes"></i> Affiliate</a>
                <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            
            <div class="profile-card">
                <i class="fa-solid fa-user-circle" style="font-size: 40px; color: var(--primary);"></i>
                <div>
                    <h4 id="sidebar-user-name">User</h4>
                    <p>KYC: <span id="sidebar-kyc-status">Pending</span></p>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- HEADER -->
            <div class="header">
                <i class="fa-solid fa-bars menu-toggle" onclick="toggleSidebar()"></i>
                <h1>My Accounts</h1>
                <div class="header-right">
                    <div class="notification-icon"><i class="fa-regular fa-bell"></i></div>
                    <span id="header-user-name">User</span>
                </div>
            </div>

            <!-- DYNAMIC ACCOUNT GRID -->
            <div class="dashboard-content">
                <div id="accounts-container" class="grid-container">
                    <!-- JS se Accounts yahan aayenge -->
                </div>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
