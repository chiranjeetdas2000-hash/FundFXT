<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>FundFXT | Trading Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{--bg:#0b0e12;--card:#11161d;--hover:#171d25;--border:#27303a;--green:#00b56a;--red:#ff4444;--muted:#8e99a8;--text:#fff;--blue:#4a90e2;--amber:#ffb020}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Poppins,sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:56px 44px minmax(0,1fr)}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border);gap:12px}.logo{font-size:19px;font-weight:700;white-space:nowrap}.logo span{color:var(--green)}.account-head{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);min-width:0}.account-head b{color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:32vw}.icon-btn{background:transparent;border:1px solid var(--border);color:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;transition:.2s ease}.icon-btn:hover{background:var(--hover);border-color:var(--green);transform:translateY(-1px)}
.summary{display:flex;gap:24px;align-items:center;padding:0 16px;background:#0e1217;border-bottom:1px solid var(--border);overflow:auto;white-space:nowrap;font-size:11px}.summary span{color:var(--muted);margin-right:5px}.summary b{font-size:12px}.green{color:var(--green)!important}.red{color:var(--red)!important}.amber{color:var(--amber)!important}
.workspace{min-height:0;display:grid;grid-template-columns:270px minmax(420px,1fr);grid-template-rows:minmax(330px,1fr) 235px 92px;grid-template-areas:'quotes chart' 'positions positions' 'account account';gap:1px;background:var(--border)}.panel{background:var(--card);min-width:0;min-height:0}.quotes{grid-area:quotes;overflow:auto}.panel-head{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}.live{font-size:10px;color:var(--green);font-weight:500}.quote{padding:10px 12px;border-bottom:1px solid #202730;cursor:pointer;transition:background .2s,transform .2s,border-color .2s}.quote:hover{background:var(--hover);transform:translateX(2px)}.quote.active{background:rgba(0,181,106,.09);box-shadow:inset 2px 0 var(--green)}.q-top,.q-bottom{display:flex;justify-content:space-between;align-items:center}.q-top b{font-size:13px}.q-bottom{margin-top:5px;font-size:11px}.ask{color:var(--green)}.bid{color:var(--red)}.change.up{color:var(--green)}.change.down{color:var(--red)}.q-prices{display:flex;gap:9px}.q-label{color:var(--muted);font-size:9px;margin-right:3px}
.chart{grid-area:chart;position:relative;min-height:0}.chart-title{position:absolute;z-index:5;top:8px;left:12px;background:rgba(11,14,18,.88);padding:5px 9px;border-radius:5px;font-size:12px;pointer-events:none}.chart-title b{font-size:14px}.chart-title span{color:var(--muted);margin-left:8px}.chartbox{width:100%;height:100%;min-height:0}.chart-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;pointer-events:none;padding-bottom:70px}.chart-state.hidden{display:none}
.tradebar{position:absolute;left:12px;right:12px;bottom:10px;z-index:8;background:rgba(17,22,29,.97);border:1px solid var(--border);border-radius:10px;padding:9px;display:grid;grid-template-columns:100px 90px minmax(100px,1fr) minmax(100px,1fr) minmax(100px,1fr) 130px 130px;gap:7px;align-items:end;box-shadow:0 12px 35px rgba(0,0,0,.28)}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:3px}.field input,.field select{width:100%;height:31px;background:#0b0e12;border:1px solid var(--border);border-radius:5px;color:#fff;padding:0 8px;outline:none;font-size:11px;transition:.2s ease}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,181,106,.12)}.side-btns{display:flex;gap:5px}.side-btn{height:31px;flex:1;border:0;border-radius:5px;color:#fff;font-weight:700;cursor:pointer;font-size:11px;transition:.2s ease}.side-btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}.buy{background:var(--green)}.sell{background:var(--red)}.side-btn:disabled,.tradebar input:disabled,.tradebar select:disabled{opacity:.45;cursor:not-allowed}.price-now{font-size:10px;color:var(--muted);text-align:center;padding-bottom:3px}
.positions{grid-area:positions;display:flex;flex-direction:column}.tabs{height:42px;display:flex;align-items:center;gap:20px;padding:0 14px;border-bottom:1px solid var(--border);overflow:auto}.tab{height:42px;display:flex;align-items:center;color:var(--muted);font-size:11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s ease}.tab:hover{color:#fff}.tab.active{color:var(--green);border-color:var(--green)}.table-wrap{overflow:auto;flex:1;position:relative}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:8px 10px;text-align:left;border-bottom:1px solid #202730;white-space:nowrap}.table th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--card);z-index:2}.action{border:0;border-radius:4px;color:#fff;padding:4px 7px;font-size:9px;cursor:pointer;background:var(--red);transition:.2s ease}.action:hover{transform:translateY(-1px);filter:brightness(1.08)}.modify{background:var(--blue);margin-right:4px}.empty{text-align:center;color:var(--muted);padding:30px}.empty.error{color:var(--amber)}
.account{grid-area:account;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:15px}.account-grid{display:flex;gap:30px;flex-wrap:wrap}.acc-item span{display:block;color:var(--muted);font-size:9px}.acc-item b{font-size:12px}.status{padding:5px 9px;border:1px solid var(--border);border-radius:15px;font-size:10px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}.account-actions{display:flex;gap:7px}.account-actions button{background:#171d25;border:1px solid var(--border);color:#fff;border-radius:6px;padding:7px 10px;font-size:10px;cursor:pointer;transition:.2s ease}.account-actions button:hover{border-color:var(--green);transform:translateY(-1px)}.connection{font-size:9px;color:var(--muted)}
@media(max-width:1100px){.workspace{grid-template-columns:225px minmax(360px,1fr)}.tradebar{grid-template-columns:80px 70px repeat(3,minmax(85px,1fr)) 105px 120px}.summary{gap:15px}}
@media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-rows:54px auto auto}.workspace{height:auto;min-height:calc(100vh - 96px);display:flex;flex-direction:column;gap:1px}.quotes{order:1;height:205px}.chart{order:2;height:500px}.positions{order:3;height:300px}.account{order:4;min-height:110px}.tradebar{left:8px;right:8px;bottom:8px;grid-template-columns:1fr 1fr;gap:6px}.tradebar .field:nth-child(n+3):nth-child(-n+5){grid-column:span 2}.tradebar .side-btns{grid-column:span 2}.account-actions{display:none}}
@media(max-width:560px){.header{padding:0 10px}.account-head{gap:6px;font-size:10px}.account-head b{max-width:45vw}.logo{font-size:17px}.summary{padding:6px 10px;gap:12px}.quotes{height:190px}.chart{height:550px}.positions{height:330px}.tradebar{padding:7px}.tradebar .field label{font-size:8px}.field input,.field select,.side-btn{height:34px}.account{padding:10px}.account-grid{gap:12px}.table{font-size:9px}.table th,.table td{padding:7px 8px}}
@media(max-width:380px){.chart{height:570px}.positions{height:340px}.tradebar{left:5px;right:5px}.summary{font-size:10px}.summary b{font-size:11px}.account-grid{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="logo">Fund<span>FXT</span></div><div class="account-head">Account <b id="accountId">Loading…</b><button class="icon-btn" aria-label="Back to account dashboard" onclick="goAccount()">↩</button></div></header>
<div class="summary"><div><span>Balance</span><b id="sumBalance">—</b></div><div><span>Equity</span><b id="sumEquity">—</b></div><div><span>Daily Loss</span><b class="red" id="sumDaily">—</b></div><div><span>Max DD</span><b class="red" id="sumDD">—</b></div><div><span>Trades</span><b id="sumTrades">—</b></div><div id="breach" class="red" style="display:none;font-weight:700">⚠ ACCOUNT BREACHED</div></div>
<main class="workspace">
<section class="panel quotes"><div class="panel-head"><span>Quotes</span><span class="live">● LIVE</span></div><div id="quoteList"></div></section>
<section class="panel chart"><div class="chart-title"><b id="chartSymbol">EURUSD</b><span>15m</span></div><div id="chartbox" class="chartbox"></div><div id="chartState" class="chart-state">Loading chart…</div>
<div class="tradebar"><div class="field"><label>Order</label><select id="orderType"><option value="MARKET">Market</option><option value="LIMIT">Limit</option><option value="STOP">Stop</option></select></div><div class="field"><label>Lots</label><input id="lots" type="number" value="0.01" min="0.01" max="2" step="0.01"></div><div class="field"><label>Entry / Pending Price</label><input id="entry" type="number" placeholder="Market"></div><div class="field"><label>Stop Loss</label><input id="sl" type="number" placeholder="Optional"></div><div class="field"><label>Take Profit</label><input id="tp" type="number" placeholder="Optional"></div><div class="field"><div class="price-now" id="currentQuote">Bid — / Ask —</div></div><div class="side-btns"><button class="side-btn buy" id="buyBtn" onclick="executeOrder('BUY')">BUY</button><button class="side-btn sell" id="sellBtn" onclick="executeOrder('SELL')">SELL</button></div></div></section>
<section class="panel positions"><div class="tabs"><div class="tab active" data-tab="positions" onclick="switchTab('positions')">Positions</div><div class="tab" data-tab="history" onclick="switchTab('history')">Trade History</div><div class="tab" data-tab="pending" onclick="switchTab('pending')">Pending Orders</div></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Symbol</th><th>Side</th><th>Lots</th><th>Entry</th><th>Current</th><th>P/L</th><th>SL</th><th>TP</th><th>Action</th></tr></thead><tbody id="tradeBody"></tbody></table><div id="empty" class="empty">Loading trades…</div></div></section>
<section class="panel account"><div class="account-grid"><div class="acc-item"><span>ACCOUNT</span><b id="accCode">—</b></div><div class="acc-item"><span>STATUS</span><div class="status"><i class="dot"></i><b id="accStatus">—</b></div></div><div class="acc-item"><span>CONNECTION</span><b class="connection" id="connection">Connecting…</b></div></div><div class="account-actions"><button onclick="goAccount()">Account Dashboard</button><button onclick="location.href='dashboard.html'">Dashboard</button></div></section>
</main></div>
<script>
const API='https://fundfxt.onrender.com';
const token=localStorage.getItem('fundfxt_token');
const params=new URLSearchParams(location.search);
let currentAccountCode=params.get('account_code');
let currentSymbol='EURUSD',currentTab='positions',prices={},account=null,widget=null,priceTimer=null,tradeTimer=null;
const fallbackPairs=['EURUSD','GBPUSD','USDJPY','AUDUSD','XAUUSD'];
const $=id=>document.getElementById(id);
const money=v=>'$'+(Number(v||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function decimals(s){return String(s).includes('JPY')?3:String(s)==='XAUUSD'?2:5}
function price(v,s=currentSymbol){return Number(v||0).toFixed(decimals(s))}
function goAccount(){location.href='account-dashboard.html?account_code='+encodeURIComponent(currentAccountCode||'')}
function setStatus(text,kind=''){const el=$('connection');el.textContent=text;el.className='connection '+kind}
function setEmpty(text,error=false){$('empty').textContent=text;$('empty').className='empty'+(error?' error':'');$('empty').style.display='block'}
function accountCodeFromStorage(){try{const keys=['fundfxt_selected_account','selectedAccount','selected_account'];for(const key of keys){const raw=sessionStorage.getItem(key)||localStorage.getItem(key);if(!raw)continue;const obj=JSON.parse(raw);const code=obj?.account_code||obj?.accountCode||obj?.account?.account_code;if(code)return String(code)}}catch(e){}return null}
async function api(path,options={}){let r;try{r=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'})}catch(e){throw new Error('Network error: unable to reach FundFXT server.')}let d={};try{d=await r.json()}catch(e){}if(!r.ok){if(r.status===401||r.status===403)throw new Error('Session expired. Please login again.');if(r.status===404)throw new Error(d.error||'FundFXT API route was not found.');throw new Error(d.error||d.message||('Server error ('+r.status+')'))}return d}
function normalizePrices(payload){let source=payload?.prices||payload?.data||payload;if(Array.isArray(source)){const out={};source.forEach(x=>{const s=x.symbol||x.pair||x.name;if(s)out[s]=x});return out}return source&&typeof source==='object'?source:{}}
async function loadAccount(){if(!currentAccountCode)throw new Error('No account selected. Open the terminal from My Accounts.');const d=await api('/api/accounts');const list=Array.isArray(d)?d:(Array.isArray(d.accounts)?d.accounts:[]);account=list.find(a=>String(a.account_code)===String(currentAccountCode));if(!account)throw new Error('Account '+currentAccountCode+' was not found for this login.');$('accountId').textContent=account.account_code;$('accCode').textContent=account.account_code;$('accStatus').textContent=account.status||'—';$('sumBalance').textContent=money(account.balance_cents);$('sumEquity').textContent=money(account.equity_cents);const summary=await api('/api/accounts/'+encodeURIComponent(account.id)+'/summary').catch(()=>null);if(summary?.success){const s=summary.summary||{};$('sumDaily').textContent=money(Math.round(Number(s.currentDailyLoss||0)*100));$('sumDD').textContent=money(Math.round(Number(s.currentMaxDrawdown||0)*100));$('sumTrades').textContent=(s.tradesToday??0)+'/'+(s.maxTrades??'—');if(s.breached)$('breach').style.display='block'}setTradingEnabled(['ACTIVE','PASSED'].includes(String(account.status).toUpperCase())&&!$('breach').offsetParent);setStatus('Account synced','green');return account}
function setTradingEnabled(on){['buyBtn','sellBtn','lots','sl','tp','entry','orderType'].forEach(id=>$(id).disabled=!on);$('entry').disabled=$('orderType').value==='MARKET'||!on}
function renderQuotes(){const list=$('quoteList');list.innerHTML=fallbackPairs.map(s=>{const p=prices[s]||{};const ch=Number(p.chp??p.change_percent??p.change_pct??p.change??0);return `<div class="quote ${s===currentSymbol?'active':''}" onclick="selectPair('${s}')"><div class="q-top"><b>${s}</b><span class="change ${ch>=0?'up':'down'}">${ch>=0?'+':''}${ch.toFixed(2)}%</span></div><div class="q-bottom"><div class="q-prices"><span><i class="q-label">BID</i><b class="bid">${p.bid==null?'—':price(p.bid,s)}</b></span><span><i class="q-label">ASK</i><b class="ask">${p.ask==null?'—':price(p.ask,s)}</b></span></div><span class="q-label">SPREAD ${p.bid!=null&&p.ask!=null?price(Math.abs(Number(p.ask)-Number(p.bid)),s):'—'}</span></div></div>`}).join('')}
function updateQuoteUI(){renderQuotes();const p=prices[currentSymbol]||{};$('currentQuote').textContent='Bid '+(p.bid==null?'—':price(p.bid))+' / Ask '+(p.ask==null?'—':price(p.ask))}
function selectPair(s){currentSymbol=s;$('chartSymbol').textContent=s;updateQuoteUI();loadChart()}
function loadChart(){const box=$('chartbox'),state=$('chartState');state.classList.remove('hidden');state.textContent='Loading '+currentSymbol+' chart…';box.innerHTML='';if(!window.TradingView){state.textContent='Chart service is unavailable right now';return}try{widget=new TradingView.widget({autosize:true,symbol:'OANDA:'+currentSymbol,interval:'15',timezone:'Etc/UTC',theme:'dark',style:'1',locale:'en',enable_publishing:false,allow_symbol_change:false,container_id:'chartbox',hide_top_toolbar:false,withdateranges:true});setTimeout(()=>state.classList.add('hidden'),1800)}catch(e){state.textContent='Unable to load chart';console.error(e)}}
function mergePrices(payload){const source=normalizePrices(payload);Object.keys(source).forEach(s=>{const p=source[s];if(p&&typeof p==='object')prices[String(s).toUpperCase()]={...prices[String(s).toUpperCase()],...p}});updateQuoteUI()}
async function pollPrices(){try{const d=await api('/api/prices');mergePrices(d);setStatus('Live prices synced','green')}catch(e){setStatus('Price feed unavailable','amber');console.warn(e.message)}}
function connectPrices(){pollPrices();if(priceTimer)clearInterval(priceTimer);priceTimer=setInterval(pollPrices,1000)}
async function loadTrades(){if(!account?.id){setEmpty('Waiting for account connection…');return}try{const d=await api('/api/accounts/'+encodeURIComponent(account.id)+'/trades');const rows=Array.isArray(d.trades)?d.trades:[];let visible;if(currentTab==='positions')visible=rows.filter(t=>String(t.status).toUpperCase()==='OPEN');else if(currentTab==='history')visible=rows.filter(t=>!['OPEN','PENDING','PLACED'].includes(String(t.status).toUpperCase()));else visible=rows.filter(t=>['PENDING','PLACED'].includes(String(t.status).toUpperCase()));renderTrades(visible)}catch(e){$('tradeBody').innerHTML='';setEmpty('Unable to load trades: '+e.message,true)}}
function renderTrades(rows){$('empty').style.display=rows.length?'none':'block';$('empty').textContent=currentTab==='positions'?'No open positions':currentTab==='history'?'No trade history':'No pending orders';$('empty').className='empty';$('tradeBody').innerHTML=rows.map(t=>{const side=String(t.side||'').toUpperCase(),open=String(t.status).toUpperCase()==='OPEN';const rawPnl=open?(t.floating_profit_cents??t.current_profit_cents??t.profit_cents??0):(t.realized_profit_cents??t.profit_cents??0);const pnl=Number(rawPnl)/100;const id=t.trade_id||t.id||'';return `<tr><td>${id}</td><td>${t.symbol||'—'}</td><td class="${side==='BUY'?'green':'red'}">${side}</td><td>${t.volume??t.lots??'—'}</td><td>${t.entry_price??'—'}</td><td>${t.current_price??t.exit_price??'—'}</td><td class="${pnl>=0?'green':'red'}">$${pnl.toFixed(2)}</td><td>${t.stop_loss??t.sl??'—'}</td><td>${t.take_profit??t.tp??'—'}</td><td>${open?`<button class="action modify" onclick="modifyTrade('${id}')">Modify</button><button class="action" onclick="closeTrade('${id}')">Close</button>`:'<span style="color:var(--muted)">${t.status||'—'}</span>'}</td></tr>`}).join('')}
function switchTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));loadTrades()}
async function executeOrder(side){if(!account)return;if(!['ACTIVE','PASSED'].includes(String(account.status).toUpperCase()))return alert('Trading is disabled for this account.');const volume=Number($('lots').value),sl=$('sl').value?Number($('sl').value):null,tp=$('tp').value?Number($('tp').value):null,type=$('orderType').value,entry=$('entry').value?Number($('entry').value):null;if(!volume||volume<.01||volume>2)return alert('Volume must be between 0.01 and 2.00 lots.');if(type!=='MARKET'&&(!entry||entry<=0))return alert('Enter a valid pending price.');const body={account_code:currentAccountCode,symbol:currentSymbol,side,volume,sl,tp};try{let d;if(type==='MARKET')d=await api('/api/trade/execute',{method:'POST',body:JSON.stringify(body)});else d=await api('/api/trades/pending',{method:'POST',body:JSON.stringify({...body,order_type:type,limit_price:entry})});if(!d.success)throw new Error(d.error||'Trade failed');alert(type==='MARKET'?'Order executed at '+d.entry_price:'Pending order placed');await loadTrades();await loadAccount()}catch(e){alert(e.message)}}
async function modifyTrade(id){const sl=prompt('New Stop Loss (blank = keep current):');const tp=prompt('New Take Profit (blank = keep current):');const body={};if(sl)body.stop_loss=Number(sl);if(tp)body.take_profit=Number(tp);if(!Object.keys(body).length)return;try{await api('/api/trades/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});await loadTrades()}catch(e){alert(e.message)}}
async function closeTrade(id){if(!confirm('Close this trade?'))return;try{await api('/api/trades/'+encodeURIComponent(id)+'/close',{method:'POST'});await loadTrades();await loadAccount()}catch(e){alert(e.message)}}
$('orderType').addEventListener('change',()=>{const market=$('orderType').value==='MARKET';$('entry').disabled=market||!account||!['ACTIVE','PASSED'].includes(String(account.status).toUpperCase());$('entry').placeholder=market?'Market':'Required price'});
window.addEventListener('error',e=>{console.error('FundFXT terminal error:',e.error||e.message)});window.addEventListener('unhandledrejection',e=>{console.error('FundFXT terminal promise error:',e.reason)});
(async function init(){
  if(!token){location.href='auth.html';return}
  if(!currentAccountCode)currentAccountCode=accountCodeFromStorage();
  renderQuotes();
  loadChart();
  connectPrices();
  try{await loadAccount()}catch(e){$('accountId').textContent=currentAccountCode||'Not selected';$('accCode').textContent=currentAccountCode||'Not selected';$('accStatus').textContent='Unavailable';setStatus('Account connection failed','amber');setEmpty(e.message,true);console.error(e)}
  if(account){await loadTrades();if(tradeTimer)clearInterval(tradeTimer);tradeTimer=setInterval(async()=>{try{await loadAccount();await loadTrades()}catch(e){console.warn(e.message)}},5000)}
})();
</script>
</body>
</html>
