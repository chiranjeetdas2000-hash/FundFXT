    // ---------- CHART ----------
    function updateChart() {
        const chartContainer = document.getElementById('tradingview_chart');
        chartContainer.innerHTML = ''; 
        // ⚠️ IMPORTANT: `allow_symbol_change: false` (Pair selection only via FundFXT)
        widget = new TradingView.widget({
            "autosize": true,
            "symbol": `OANDA:${currentSymbol}`,
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "allow_symbol_change": false, // Yahan lock kiya
            "backgroundColor": "#151924",
            "gridColor": "#2a2e39",
            "container_id": "tradingview_chart"
        });
    }

    function selectPair(symbol) {
        currentSymbol = symbol;
        updateChart();
        updateOrderPanel(symbol);
    }

    // ---------- BACKEND WEBSOCKET (Kraken REMOVED) ----------
    let backendSocket;

    function connectBackendWS() {
        backendSocket = new WebSocket('wss://fundfxt.onrender.com/ws');

        backendSocket.onopen = () => {
            const statusBadge = document.getElementById('apiStatus');
            if (statusBadge) {
                statusBadge.classList.add('connected');
                statusBadge.innerHTML = '<i class="fa-solid fa-circle"></i> Live FCS Connected';
            }
        };

        backendSocket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'price') {
                updatePricesFromBackend(data.data);
            }
        };

        backendSocket.onclose = () => setTimeout(connectBackendWS, 3000);
    }

    // ---------- EXECUTE ORDERS (Backend Controls Price) ----------
async function executeOrder(side) {
    const accountCode = document.getElementById('accountId').innerText;  // This should be the account code
    const volume = parseFloat(document.getElementById('mktLots').value);
    const sl = parseFloat(document.getElementById('mktSL').value) || null;
    const tp = parseFloat(document.getElementById('mktTP').value) || null;
    const token = localStorage.getItem('fundfxt_token');

    if (!token) return alert("Please login");

    const response = await fetch('https://fundfxt.onrender.com/api/trade/execute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ account_code: accountCode, symbol: currentSymbol, side, volume, sl, tp })
    });
    
    const data = await response.json();
    if (data.success) {
        alert(`✅ Order Executed at Backend Price: ${data.entry_price}`);
        loadPositions();
    } else {
        alert(data.error || 'Trade failed');
    }
}

async function loadPositions() {

    const response = await fetch(`https://fundfxt.onrender.com/api/trade/get?account_code=${accountCode}`, {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('fundfxt_token')}` }
    });

    window.onload = () => {
        renderPairs();
        updateChart();
        connectBackendWS(); // FCS connected via Backend
        loadPositions();
        
        // Resizable logic same
        if (window.innerWidth > 1100) {
            initResizer('resizerLeft', 'leftPanel', 'centerPanel', true);
            initResizer('resizerRight', 'centerPanel', 'rightPanel', false);
        }
    };
</script>
